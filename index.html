:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#06121e;color:#eaf7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#15374a 0,transparent 43%),#06121e;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1130px;margin:auto;padding:18px}.nav{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;position:sticky;top:0;backdrop-filter:blur(16px);z-index:5;background:#06121edb}.logo{font-size:21px;font-weight:850;letter-spacing:-.6px}.logo em{font-style:normal;color:#43e0ef}.links{display:flex;gap:7px;flex-wrap:wrap}.btn,.chip{border:1px solid #28465d;background:#10283a;color:#eaf7ff;border-radius:12px;padding:11px 14px;font-weight:600}.btn:hover,.chip:hover{border-color:#52dcea;background:#17394b}.primary{background:#24b6ce;color:#041820;border-color:#24b6ce}.primary:hover{background:#65e9f2}.ghost{background:transparent;border-color:transparent}.card{border:1px solid #274055;background:#0c2030ea;border-radius:20px;padding:20px;box-shadow:0 14px 40px #0002}.hero{padding:44px 28px;background:linear-gradient(125deg,#0c283a,#0b2232 60%,#17475b);border:1px solid #2c5365;border-radius:24px}.hero h1{font-size:clamp(29px,6vw,58px);line-height:1.08;letter-spacing:-2px;margin:10px 0}.hero p{color:#b6d2df;max-width:700px;font-size:17px}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:#71e4ee;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px;margin:20px 0}.subject{display:flex;flex-direction:column;justify-content:space-between;min-height:150px;text-align:left}.subject b{font-size:17px}.muted{color:#a0bfd0}.small{font-size:13px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#173b4a;color:#8de9ef;font-size:12px}.score{color:#78e7ad}h2{margin-top:30px;letter-spacing:-.6px}h3{margin:0 0 10px}.q{padding:17px;border:1px solid #244357;border-radius:13px;margin:12px 0}.option{display:flex;gap:9px;padding:10px;border:1px solid #28485d;border-radius:10px;margin:7px 0;cursor:pointer}.option:hover{background:#143345}.option input{accent-color:#49e1e9}.field{width:100%;padding:12px;border-radius:11px;border:1px solid #436071;background:#071a28;color:white;margin:8px 0 14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.box{padding:15px;border-radius:12px;background:#102c3b;margin:12px 0}.ok{color:#8ce6a9}.bad{color:#ffb1ae}.warning{background:#4b391d;color:#ffe1a3;border-radius:12px;padding:12px}.tag{font-size:12px;color:#97c0d1}footer{color:#7895a5;padding:35px 0;text-align:center}.hide{display:none}.badge{font-size:13px;color:#65deef}@media(max-width:640px){.nav{align-items:start;flex-direction:column}.links{gap:4px}.btn{padding:9px 11px}.hero{padding:26px 20px}.card{padding:15px}}

import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/+esm';
const db=createClient("https://xtrgmxnohdmlckspyaza.supabase.co","sb_publishable_qaihRrq4CS3Fkq76TxF8LA_0avgs-xX");const subjects=["Anatomía por la imagen","Atención al paciente","Protección radiológica","Laboratorio forense","Inglés","Itinerario empleabilidad I","Itinerario empleabilidad II","Fundamentos físicos y equipos","Técnicas de radiología simple","Técnicas de radiología especial","Tomografía computarizada y ecografía","Resonancia magnética","Medicina nuclear","Radiofarmacia","Sostenibilidad","Digitalización","Proyecto"];const sample=[{"subject":"Anatomía por la imagen","title":"Aparato cardiocirculatorio","summary":"El corazón actúa como una bomba muscular. Las aurículas reciben sangre y los ventrículos la impulsan. La circulación mayor envía sangre del ventrículo izquierdo a los tejidos y regresa a la aurícula derecha. La circulación menor envía sangre del ventrículo derecho a los pulmones y regresa a la aurícula izquierda. Sístole significa contracción y diástole relajación.","questions":[["¿Qué cavidad impulsa sangre hacia todo el cuerpo?",["Aurícula derecha","Ventrículo izquierdo","Ventrículo derecho","Aurícula izquierda"],1,"El ventrículo izquierdo la impulsa por la aorta."],["¿Qué válvula se encuentra entre aurícula derecha y ventrículo derecho?",["Mitral","Aórtica","Tricúspide","Pulmonar"],2,"La tricúspide separa esas cavidades."],["¿Qué significa sístole ventricular?",["Llenado","Contracción","Reposo","Intercambio"],1,"Es la fase de contracción ventricular."]]},{"subject":"Anatomía por la imagen","title":"Sistema nervioso","summary":"El sistema nervioso central (SNC) incluye encéfalo y médula espinal. Interpreta la información y organiza respuestas. El sistema nervioso periférico (SNP) son los nervios y ganglios que comunican el centro de control con el cuerpo. El cerebelo coordina el equilibrio. El lóbulo occipital procesa la visión.","questions":[["¿Qué estructuras forman el SNC?",["Corazón y pulmones","Encéfalo y médula espinal","Músculos y tendones","Nervios periféricos"],1,"El SNC está formado por encéfalo y médula espinal."],["¿Qué lóbulo procesa la visión?",["Temporal","Frontal","Occipital","Parietal"],2,"La visión se procesa principalmente en el occipital."],["¿Qué estructura coordina el equilibrio?",["Cerebelo","Tálamo","Hipófisis","Tráquea"],0,"El cerebelo interviene en el equilibrio y la coordinación."]]},{"subject":"Protección radiológica","title":"Tiempo, distancia y blindaje","summary":"Para reducir exposición a radiaciones ionizantes se limita el tiempo cerca de la fuente, se aumenta la distancia y se utilizan barreras de protección apropiadas. En una fuente puntual ideal, la intensidad disminuye aproximadamente con el cuadrado de la distancia; duplicar la distancia reduce la intensidad a una cuarta parte.","questions":[["¿Qué ocurre si duplicas la distancia a una fuente puntual ideal?",["Se duplica la intensidad","Se reduce a la mitad","Se reduce a la cuarta parte","No cambia"],2,"La intensidad sigue aproximadamente la ley inversa del cuadrado."],["¿Qué medida disminuye la dosis?",["Aumentar el tiempo","Disminuir la distancia","Usar blindaje apropiado","Ignorar el dosímetro"],2,"El blindaje adecuado reduce la exposición."],["¿Cuáles son los tres principios básicos?",["Tiempo, distancia, blindaje","Temperatura, masa, presión","Ruido, luz, calor","Velocidad, carga, energía"],0,"Son las tres medidas clásicas de protección radiológica."]]},{"subject":"Atención al paciente","title":"Comunicación con el paciente","summary":"La comunicación tiene emisor, receptor, mensaje, canal, código y contexto. Para comunicarte bien, usa lenguaje claro, escucha activamente, comprueba la comprensión y adapta la explicación a la edad, situación y necesidades del paciente. Los tecnicismos excesivos pueden crear barreras de comunicación.","questions":[["¿Qué puede dificultar la comunicación?",["Explicar con claridad","Usar tecnicismos sin explicar","Escuchar activamente","Preguntar dudas"],1,"Los tecnicismos dificultan la comprensión."],["¿Quién recibe el mensaje?",["El emisor","El receptor","El canal","El código"],1,"El receptor es quien recibe la información."],["¿Qué conviene hacer ante pérdida auditiva?",["Gritar desde lejos","Hablar de espaldas","Confirmar que comprende","Ignorar preguntas"],2,"Hay que adaptar la comunicación y comprobar la comprensión."]]},{"subject":"Inglés","title":"Past Simple","summary":"El Past Simple expresa acciones terminadas en el pasado. En afirmativa: I worked yesterday. En negativa: I didn't work yesterday. En pregunta: Did you work yesterday? El verbo vuelve a su forma base cuando aparece did/didn't.","questions":[["Elige la negativa correcta:",["She didn't went","She didn't go","She don't go","She not went"],1,"Después de didn't va el verbo en infinitivo sin to."],["¿Qué auxiliar forma preguntas en Past Simple?",["Do","Does","Did","Will"],2,"Usamos Did + sujeto + verbo base."],["¿Cuál es el pasado de go?",["Goed","Goes","Gone","Went"],3,"Go es irregular: went."]]}];const m=document.querySelector('#main');let user=null,profile=null,remote=[],attempts=[],mistakes=[],curSubject='',curLesson=null,answers={},mode='test',lastView='home',room='general',channel=null,admin=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&quot;':'&quot;',"'":'&#39;'}[k]));const btn=(t,p='')=>'<button class="btn '+p+'">'+t+'</button>';const own=()=>user?.id;function notify(s,bad=false){const a=document.createElement('div');a.className='box '+(bad?'bad':'ok');a.textContent=s;m.prepend(a);setTimeout(()=>a.remove(),6000)}function title(s){return '<div class="row spread"><button class="btn ghost" data-go="back">← Atrás</button><span class="pill">🧠 Aprende · Practica · Domina</span></div><h2>'+esc(s)+'</h2>'}
const getLessons=s=>[...sample.filter(x=>x.subject===s).map((x,i)=>({...x,id:'demo_'+subjects.indexOf(s)+'_'+i,demo:true})),...remote.filter(x=>x.subject===s)];
async function refresh(){const {data:{session}}=await db.auth.getSession();user=session?.user||null;profile=null;attempts=[];mistakes=[];admin=false;if(user){const r=await Promise.all([db.from('profiles').select('*').eq('id',user.id).maybeSingle(),db.from('attempts').select('*').order('created_at',{ascending:false}).limit(150),db.from('mistakes').select('*'),db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle()]);profile=r[0].data;attempts=r[1].data||[];mistakes=r[2].data||[];admin=!!r[3].data;}const l=await db.from('lessons').select('*').eq('published',true);remote=l.data||[]}
function home(){lastView='home';m.innerHTML='<section class="hero"><div class="eyebrow">Tu academia de radiodiagnóstico</div><h1>Aprender radiología<br>puede ser un juego.</h1><p>Elige la asignatura, estudia con resúmenes sencillos, practica con tests y repasa automáticamente tus errores. Tu progreso queda asociado a tu cuenta.</p><div class="row"><button class="btn primary" data-go="subjects">Explorar asignaturas →</button><button class="btn" data-go="profile">Mi progreso</button></div></section><div class="grid"><div class="card"><h3>📚 '+subjects.length+' asignaturas</h3><p class="muted">Todas visibles y seleccionables.</p></div><div class="card"><h3>🎯 '+attempts.length+' exámenes</h3><p class="muted">Intentos vinculados a tu perfil.</p></div><div class="card"><h3>💡 '+mistakes.length+' fallos pendientes</h3><p class="muted">Repite lo que más te cuesta.</p></div><div class="card"><h3>⚡ '+attempts.reduce((n,a)=>n+a.correct*10,0)+' XP</h3><p class="muted">10 puntos por acierto.</p></div></div><div class="warning">Los temas marcados como DEMO son explicaciones originales de muestra: aún no sustituyen el material completo de tu Drive.</div>'}
function subjectsPage(){lastView='subjects';m.innerHTML=title('Selecciona tu asignatura')+'<input id="search" class="field" placeholder="🔎 Buscar asignatura..."><div id="cards" class="grid"></div>';function draw(){const t=document.querySelector('#search').value.toLowerCase();document.querySelector('#cards').innerHTML=subjects.map((s,i)=>({s,i})).filter(o=>o.s.toLowerCase().includes(t)).map(({s,i})=>'<button class="card subject" data-sub="'+i+'"><span style="font-size:29px">'+['🫀','🩺','☢️','🔬','🇬🇧','💼','🧭','⚙️','🩻','📸','🖥️','🧲','⚛️','💊','🌱','💻','📑'][i]+'</span><b>'+esc(s)+'</b><span class="tag">'+getLessons(s).length+' temas disponibles</span></button>').join('')}document.querySelector('#search').oninput=draw;draw()}
function subjectPage(s){curSubject=s;lastView='subjects';m.innerHTML=title(s)+'<p class="muted">Escoge un tema o practica toda la asignatura.</p><div class="grid">'+getLessons(s).map((l,i)=>'<button class="card subject" data-lesson="'+i+'"><span class="pill">'+(l.demo?'DEMO · ':'')+'Tema '+(i+1)+'</span><b>'+esc(l.title)+'</b><span class="muted small">Resumen + ejercicios</span></button>').join('')+'</div>'+(getLessons(s).length?'<button class="btn primary" data-all="1">🧪 Test combinado de esta asignatura</button>':'<div class="box">Aún no hay lecciones publicadas en esta asignatura. Un administrador podrá incorporarlas.</div>')}
function lessonPage(l){curLesson=l;lastView='subject';m.innerHTML=title(l.title)+'<div class="pill">'+esc(l.subject)+(l.demo?' · Contenido de muestra':'')+'</div><div class="card"><h3>📖 Resumen explicado fácil</h3><p style="line-height:1.9">'+esc(l.summary||'Pendiente de resumen').replace(/\n/g,'<br>')+'</p><div class="box">🧠 Truco: explica cada apartado con tus propias palabras para comprobar si lo has entendido.</div></div><div class="grid"><button class="btn primary" data-start="test">📝 Test con nota</button><button class="btn" data-start="timed">⏱️ Contrarreloj</button><button class="btn" data-start="cards">🗂️ Tarjetas de repaso</button></div>'}
function flashcards(){const qs=curLesson.questions||[];m.innerHTML=title('Tarjetas · '+curLesson.title)+(qs.length?'<div id="flash" class="card"></div><div class="row"><button class="btn" id="prevCard">Anterior</button><button class="btn primary" id="nextCard">Siguiente</button></div>':'No hay tarjetas todavía.');let i=0,flip=false;function show(){document.querySelector('#flash').innerHTML='<div class="small muted">Tarjeta '+(i+1)+' de '+qs.length+'</div><h2>'+esc(flip?qs[i][1][qs[i][2]]:qs[i][0])+'</h2><p class="muted">'+(flip?esc(qs[i][3]):'Toca para descubrir la respuesta')+'</p>';document.querySelector('#flash').onclick=()=>{flip=!flip;show()}}if(qs.length){show();document.querySelector('#prevCard').onclick=()=>{i=(i+qs.length-1)%qs.length;flip=false;show()};document.querySelector('#nextCard').onclick=()=>{i=(i+1)%qs.length;flip=false;show()}}}
let testQs=[],timer=null,ends=0;function testStart(type){if(timer)clearInterval(timer);mode=type;answers={};let ls=type==='mistakes'?sample.filter(s=>mistakes.some(x=>x.lesson_id===getLessons(s.subject).find(l=>l.title===s.title)?.id)):null;testQs=type==='mistakes'?sample.flatMap(s=>{const id=getLessons(s.subject).find(l=>l.title===s.title)?.id;return s.questions.map((q,i)=>({q,id,i,title:s.title})).filter(o=>mistakes.some(y=>y.question_id===o.id+'_'+o.i))}):(type==='all'?getLessons(curSubject).flatMap(l=>(l.questions||[]).map((q,i)=>({q,id:l.id,i,title:l.title}))):(curLesson.questions||[]).map((q,i)=>({q,id:curLesson.id,i,title:curLesson.title})));if(!testQs.length){m.innerHTML=title('Sin preguntas disponibles')+'<p>Abre otra lección o vuelve cuando haya nuevas preguntas.</p>';return}ends=type==='timed'?Date.now()+60000:0;renderTest();if(ends){timer=setInterval(()=>{const x=document.querySelector('#clock');if(!x){clearInterval(timer);return}const sec=Math.max(0,Math.ceil((ends-Date.now())/1000));x.textContent='⏱️ '+sec+' segundos';if(sec===0){clearInterval(timer);grade()}},500)}}
function renderTest(){m.innerHTML=title(mode==='mistakes'?'Repite tus fallos':mode==='timed'?'Examen contrarreloj':'Examen de práctica')+'<div id="clock" class="pill">'+(ends?'⏱️ 60 segundos':'Cada pregunta tiene una respuesta correcta')+'</div>'+testQs.map((o,i)=>'<div class="q"><b>'+(i+1)+'. '+esc(o.q[0])+'</b>'+o.q[1].map((x,j)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+esc(x)+'</label>').join('')+'</div>').join('')+'<button class="btn primary" id="grade">Corregir y guardar mi nota</button>';document.querySelector('#grade').onclick=grade}
async function grade(){if(timer)clearInterval(timer);if(!document.querySelector('#grade'))return;const selected=testQs.map((o,i)=>document.querySelector('input[name="q'+i+'"]:checked')?.value);const correct=testQs.filter((o,i)=>Number(selected[i])===o.q[2]&&selected[i]!==undefined).length;const mark=Math.round(correct/testQs.length*100)/10;m.innerHTML=title('Resultado del examen')+'<div class="card"><h1 class="'+(mark>=5?'ok':'bad')+'">'+mark.toFixed(1)+'/10</h1><p>'+correct+' aciertos de '+testQs.length+'. '+(mark>=5?'¡Sigue así!':'Repasa las explicaciones y vuelve a intentarlo.')+'</p></div>'+testQs.map((o,i)=>'<div class="box"><b>'+(i+1)+'. '+esc(o.q[0])+'</b><p class="'+(Number(selected[i])===o.q[2]&&selected[i]!==undefined?'ok':'bad')+'">'+(Number(selected[i])===o.q[2]&&selected[i]!==undefined?'✓ Correcta':'✕ Correcta: '+esc(o.q[1][o.q[2]]))+'</p><p class="muted">'+esc(o.q[3])+'</p></div>').join('')+'<button class="btn primary" data-go="mistakes">Repasar mis fallos</button>';if(user){const r=await db.from('attempts').insert({user_id:user.id,lesson_id:mode==='all'?'mixto_'+curSubject:mode==='mistakes'?'repaso':curLesson?.id||'mixto',score:Math.round(mark),correct,total:testQs.length});if(r.error)notify('No se pudo guardar la nota: '+r.error.message,true);const updates=testQs.map((o,i)=>Number(selected[i])===o.q[2]&&selected[i]!==undefined?db.from('mistakes').delete().eq('user_id',user.id).eq('question_id',o.id+'_'+o.i):db.from('mistakes').upsert({user_id:user.id,question_id:o.id+'_'+o.i,lesson_id:o.id},{onConflict:'user_id,question_id'}));await Promise.all(updates);await refresh();}else notify('Inicia sesión para guardar tus resultados en la nube.',true)}
function profilePage(){lastView='profile';m.innerHTML=title('Mi perfil')+(user?'<div class="card"><div class="row"><h1>'+(profile?.avatar||'🩻')+'</h1><div><h3>'+esc(profile?.username||'Alumno')+'</h3><span class="muted">Cuenta registrada</span></div></div><div class="grid"><div class="box">📝 '+attempts.length+' tests</div><div class="box">⚡ '+attempts.reduce((n,a)=>n+a.correct*10,0)+' XP</div><div class="box">🎯 '+mistakes.length+' fallos</div></div><label>Apodo</label><input id="username" class="field" maxlength="30" value="'+esc(profile?.username||'')+'"><label>Emoji de perfil</label><select id="avatar" class="field">'+['🩻','🧠','🔬','⚛️','☢️','🩺','👩‍⚕️','👨‍⚕️','💙','🦴'].map(x=>'<option '+(profile?.avatar===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button id="saveProfile" class="btn primary">Guardar perfil</button> <button class="btn" id="logout">Cerrar sesión</button> '+(admin?'<button class="btn" data-go="admin">⚙️ Administrar temario</button>':'')+'</div><h2>Mis últimas notas</h2><div class="card">'+(attempts.length?attempts.slice(0,20).map(x=>'<p>'+esc(x.lesson_id)+' · <b>'+x.score+'/10</b> · '+new Date(x.created_at).toLocaleDateString('es-ES')+'</p>').join(''):'Aún no has realizado ningún test.')+'</div>':'<div class="grid"><div class="card"><h3>Entrar</h3><input id="mail" class="field" type="email" placeholder="Correo electrónico"><input id="pass" class="field" type="password" placeholder="Contraseña"><button class="btn primary" id="login">Iniciar sesión</button></div><div class="card"><h3>Registrarse gratis</h3><input id="newmail" class="field" type="email" placeholder="Correo electrónico"><input id="newpass" class="field" type="password" minlength="8" placeholder="Contraseña (mínimo 8 caracteres)"><button class="btn primary" id="signup">Crear cuenta</button><p class="small muted">Puede ser necesario confirmar tu correo.</p></div></div>');if(user){document.querySelector('#saveProfile').onclick=async()=>{const v=document.querySelector('#username').value.trim();if(v.length<3)return notify('El apodo debe tener al menos 3 caracteres',true);const r=await db.from('profiles').update({username:v,avatar:document.querySelector('#avatar').value}).eq('id',user.id);if(r.error)notify(r.error.message,true);else{await refresh();profilePage();notify('Perfil actualizado')}};document.querySelector('#logout').onclick=async()=>{await db.auth.signOut();await refresh();profilePage()}}else{document.querySelector('#login').onclick=async()=>{const x=await db.auth.signInWithPassword({email:document.querySelector('#mail').value,password:document.querySelector('#pass').value});if(x.error)return notify(x.error.message,true);await refresh();profilePage()};document.querySelector('#signup').onclick=async()=>{const x=await db.auth.signUp({email:document.querySelector('#newmail').value,password:document.querySelector('#newpass').value});if(x.error)return notify(x.error.message,true);await refresh();profilePage();notify('Registro enviado. Revisa tu correo para confirmar la cuenta.')};}}
async function forumPage(){lastView='forum';if(channel){db.removeChannel(channel);channel=null}if(!user){m.innerHTML=title('Foro de dudas')+'<p>Inicia sesión para participar en el foro.</p><button class="btn primary" data-go="profile">Entrar / Registrarse</button>';return}m.innerHTML=title('Foro de dudas')+'<div class="row"><select id="room" class="field" style="max-width:330px"><option value="general">🌍 General</option>'+subjects.map((s,i)=>'<option value="s'+i+'">'+esc(s)+'</option>').join('')+'</select></div><div id="posts" class="card">Cargando mensajes…</div><div class="card"><textarea id="body" class="field" rows="3" maxlength="1000" placeholder="Comparte una duda o ayuda a un compañero…"></textarea><button id="send" class="btn primary">Enviar mensaje</button></div>';document.querySelector('#room').value=room;document.querySelector('#room').onchange=()=>{room=document.querySelector('#room').value;forumPage()};async function load(){const p=await db.from('forum_posts').select('id,author_id,body,created_at').eq('room',room).order('created_at',{ascending:false}).limit(60);let ids=[...new Set((p.data||[]).map(x=>x.author_id))];let users={};if(ids.length){const a=await db.from('profiles').select('id,username,avatar').in('id',ids);users=Object.fromEntries((a.data||[]).map(v=>[v.id,v]))}const x=document.querySelector('#posts');if(x)x.innerHTML=(p.data||[]).map(v=>'<div class="box"><b>'+esc(users[v.author_id]?.avatar||'🩻')+' '+esc(users[v.author_id]?.username||'Alumno')+'</b> <span class="small muted">'+new Date(v.created_at).toLocaleString('es-ES')+'</span><p>'+esc(v.body)+'</p></div>').join('')||'Sé el primero en escribir.'}await load();document.querySelector('#send').onclick=async()=>{const txt=document.querySelector('#body').value.trim();if(!txt)return;const r=await db.from('forum_posts').insert({author_id:user.id,room,body:txt});if(r.error)return notify(r.error.message,true);document.querySelector('#body').value='';await load()};channel=db.channel('foro-'+room).on('postgres_changes',{event:'INSERT',schema:'public',table:'forum_posts',filter:'room=eq.'+room},()=>load()).subscribe()}
async function ranking(){lastView='rank';m.innerHTML=title('Ranking de alumnos')+'<div id="ranking" class="card">Cargando…</div>';const r=await db.from('leaderboard_totals').select('user_id,xp,exams').order('xp',{ascending:false}).limit(30);if(!r.error&&r.data?.length){const u=await db.from('profiles').select('id,username,avatar').in('id',r.data.map(z=>z.user_id));const map=Object.fromEntries((u.data||[]).map(z=>[z.id,z]));r.data=r.data.map(z=>({...z,...(map[z.user_id]||{username:'Alumno',avatar:'🩻'})}))}const x=document.querySelector('#ranking');if(r.error){x.innerHTML='<p class="bad">'+esc(r.error.message)+'</p>';return}x.innerHTML=(r.data||[]).map((v,i)=>'<div class="box">'+(i+1)+'. '+esc(v.avatar)+' <b>'+esc(v.username)+'</b> — <span class="score">'+v.xp+' XP</span> · '+v.exams+' exámenes</div>').join('')||'Todavía no hay participantes.'}
function mistakesPage(){lastView='mistakes';m.innerHTML=title('Repaso de mis fallos')+'<div class="card"><h3>🎯 '+mistakes.length+' preguntas pendientes</h3><p class="muted">Cada error se guarda en tu cuenta y desaparece cuando lo aciertas en otro test.</p><button class="btn primary" id="startMistakes">Practicar mis fallos →</button></div>';document.querySelector('#startMistakes').onclick=()=>testStart('mistakes')}
async function adminPage(){if(!admin){m.innerHTML=title('Acceso restringido')+'Solo los administradores pueden editar el temario.';return}lastView='admin';m.innerHTML=title('Publicar un tema')+'<div class="card"><p class="muted">Editor reservado a administradores. Preguntas en JSON: [["Pregunta",["A","B","C","D"],0,"Explicación"]]</p><label>Asignatura</label><select class="field" id="asub">'+subjects.map(s=>'<option>'+esc(s)+'</option>').join('')+'</select><label>Título</label><input id="atitle" class="field" placeholder="Nombre de la unidad"><label>Resumen</label><textarea id="asummary" class="field" rows="7" placeholder="Escribe una explicación original y revisada"></textarea><label>Preguntas JSON</label><textarea id="aq" class="field" rows="5">[]</textarea><button class="btn primary" id="publish">Publicar tema</button></div>';document.querySelector('#publish').onclick=async()=>{let qs;try{qs=JSON.parse(document.querySelector('#aq').value);if(!Array.isArray(qs))throw Error()}catch{return notify('Formato de preguntas inválido',true)}const title=document.querySelector('#atitle').value.trim(),summary=document.querySelector('#asummary').value.trim();if(title.length<3||summary.length<30)return notify('Completa el título y un resumen de al menos 30 caracteres',true);const id='tema_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);const r=await db.from('lessons').insert({id,subject:document.querySelector('#asub').value,title,summary,questions:qs,published:true});if(r.error)return notify(r.error.message,true);await refresh();adminPage();notify('Tema publicado correctamente')}}
let previous='home';function go(s){if(s==='back'){if(lastView==='subject')subjectPage(curSubject);else home();return}if(channel&&s!=='forum'){db.removeChannel(channel);channel=null}if(s==='home')home();if(s==='subjects')subjectsPage();if(s==='mistakes')mistakesPage();if(s==='profile')profilePage();if(s==='forum')forumPage();if(s==='rank')ranking();if(s==='admin')adminPage();scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-sub],[data-lesson],[data-start],[data-all]');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.sub!==undefined){subjectPage(subjects[Number(b.dataset.sub)]);return}if(b.dataset.lesson!==undefined){lessonPage(getLessons(curSubject)[Number(b.dataset.lesson)]);return}if(b.dataset.all){testStart('all');return}if(b.dataset.start){if(b.dataset.start==='cards')flashcards();else testStart(b.dataset.start)}});window.addEventListener('popstate',()=>home());await refresh();home();db.auth.onAuthStateChange(()=>{setTimeout(async()=>{await refresh()},100)});
</script></body></html>
