<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Radiolab · Duelos con ruleta</title><meta name="theme-color" content="#071320"><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#071320;color:#edfaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#16435a,#071320 55%);min-height:100vh}main{max-width:960px;margin:auto;padding:22px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-size:24px;font-weight:850;color:#f0fdff}.brand span{color:#3adef0}a{color:#5bdfef}.card{border:1px solid #285266;background:#10283a;border-radius:22px;padding:24px;margin:18px 0}.hero{background:linear-gradient(120deg,#135370,#11273d);padding:32px}.muted{color:#a4c5d6}.btn{border:1px solid #37647a;background:#173b50;color:#edfaff;border-radius:13px;font-weight:700;padding:12px 17px;cursor:pointer}.btn.primary{background:#36d7e9;color:#062131;border-color:#36d7e9}.btn:disabled{opacity:.42;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.field{width:100%;border:1px solid #3d6175;background:#081d2d;color:white;padding:12px;border-radius:11px;margin:10px 0 16px;font:inherit}.pill{display:inline-block;background:#1b4b60;color:#8df0f0;padding:8px 13px;border-radius:20px}.wheel{width:min(320px,75vw);aspect-ratio:1;border-radius:50%;border:10px solid #32637a;margin:24px auto;box-shadow:0 0 0 6px #10374b,0 0 50px #09adc933;background:conic-gradient(#22c7db 0 36deg,#2f81c7 36deg 72deg,#9c73d6 72deg 108deg,#ec9f4b 108deg 144deg,#46b797 144deg 180deg,#d96888 180deg 216deg,#248ba1 216deg 252deg,#a0b345 252deg 288deg,#a86ca8 288deg 324deg,#2eaa84 324deg 360deg);display:grid;place-items:center;transition:transform 2.3s cubic-bezier(.17,.8,.18,1)}.wheel:before{content:'🩻';background:#092333;border:5px solid white;border-radius:50%;font-size:40px;width:90px;height:90px;display:grid;place-items:center}.wheelouter{text-align:center}.pointer{font-size:33px;margin-bottom:-22px;position:relative;z-index:1}.options{display:grid;gap:10px}.option{text-align:left;padding:15px;border:1px solid #36596b;color:#eef9ff;background:#122f41;border-radius:13px;font-size:16px;cursor:pointer}.option.selected{border-color:#43e4f0;background:#18566b}.head{font-size:30px;margin:0 0 8px}.figure{font-size:50px}.count{font-size:45px;font-weight:900;color:#63e9ef}.ok{color:#87efa7}.error{color:#ffb2b2}.hidden{display:none}.notice{background:#3e2b22;padding:14px;border-radius:12px;color:#ffcfad}.collection{display:flex;gap:9px;flex-wrap:wrap}.figurecard{border:1px solid #366375;padding:16px;border-radius:15px;text-align:center;min-width:110px;background:#102c40}.figures{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}label{font-weight:700}p{line-height:1.55}@media(max-width:600px){.card{padding:17px}.hero{padding:21px}.head{font-size:25px}}</style></head><body><main><div class="bar"><div class="brand">🩻 RADIO<span>LAB</span> <small style="font-weight:400;font-size:13px">ARENA</small></div><a href="./">← Volver a la academia</a></div><div id="app"><div class="card hero"><h1>🎡 Duelos con ruleta</h1><p>Cargando la arena...</p></div></div></main><script type="module">
import {subjects,lessons} from './content.js';
import {expandedLessons} from './extra-content.js';
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './config.js';
const box=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;','\'':'&#39;'}[c]));
let supa=null,user=null,room=null,answers={},lastQuestion=-1,submitted=false,results=[],timer=null,chars=[],animation=0,spinner=false,warning='';
const CAT=[['anatomia','🦴','Osteón'],['proteccion','☢️','Fotón'],['atencion','🩺','Cora'],['forense','🔬','Detective ADN'],['ingles','🌍','Lingua'],['fundamentos','⚡','Voltio'],['tc','🖥️','Voxel'],['rm','🧲','Magneto'],['nuclear','⚛️','Isótopo'],['radiofarmacia','💊','Radiofármaco']];
const BANK=[...lessons,...expandedLessons].flatMap(l=>l.questions.map((q,i)=>({key:l.id+':'+i,sub:l.subject,q})));
const CAT_VALID=CAT.filter(c=>BANK.filter(q=>q.sub===c[0]).length>=3);
function show(s){box.innerHTML=s}function msg(t){warning=t;const n=document.getElementById('notice');if(n){n.textContent=t;n.classList.remove('hidden')}else alert(t)}
function basic(){show('<div class="card hero"><h1 class="head">🎡 Preguntados Radiolab</h1><p>Duelo 1 contra 1 con ruleta de categorías, preguntas con 20 segundos por respuesta y personajes coleccionables.</p><span class="pill">Para jugar necesitas una cuenta Radiolab</span></div><div class="card"><h2>Inicia sesión desde la academia</h2><p>Para registrar el duelo y tus personajes, entra con tu usuario y vuelve aquí.</p><a class="btn primary" href="./#auth">Abrir academia</a></div>')}
function lobby(){let list=CAT_VALID.map(c=>'<option value="'+c[0]+'">'+c[1]+' '+esc(subjects.find(s=>s[0]===c[0])?.[1])+'</option>').join('');show('<div class="card hero"><h1 class="head">🎡 Arena de Radiolab</h1><p>Crea una sala, envía el código y consigue personajes al dominar las categorías.</p><span class="pill">👤 '+esc(user?.email?.split('@')[0])+'</span></div><div class="grid"><section class="card"><h2>⚔️ Crear duelo</h2><p class="muted">El anfitrión girará la ruleta cuando los dos estén dentro.</p><button class="btn primary" id="create">Crear sala 1 vs 1</button></section><section class="card"><h2>🎟️ Unirme con código</h2><input class="field" id="code" maxlength="6" placeholder="ABC123"><button class="btn primary" id="join">Unirse al duelo</button></section></div><div class="card"><h2>🏅 Mis personajes</h2><div class="collection">'+(chars.length?chars.map(c=>'<div class="figurecard"><div class="figure">'+(CAT.find(x=>x[0]===c.category)?.[1]||'🏅')+'</div><b>'+esc(c.character_name)+'</b></div>').join(''):'Gana al menos 3 de 5 preguntas de una categoría para desbloquear su personaje.')+'</div></div>');document.getElementById('create').onclick=create;document.getElementById('join').onclick=join}
async function fetchRoom(){if(!room)return;const r=await supa.from('duel_rooms').select('*').eq('id',room.id).maybeSingle();if(r.data)room=r.data;}
async function getResults(){if(!room)return;const r=await supa.from('duel_results').select('*').eq('room_id',room.id);results=r.data||[]}
async function create(){const code=Array.from(crypto.getRandomValues(new Uint8Array(6)),v=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[v%32]).join('');const r=await supa.from('duel_rooms').insert({code,host_id:user.id}).select().single();if(r.error)return msg(r.error.message);room=r.data;answers={};submitted=false;await displayRoom()}
async function join(){const code=document.getElementById('code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))return msg('Introduce un código de 6 caracteres');const r=await supa.from('duel_rooms').select('*').eq('code',code).maybeSingle();if(!r.data)return msg('No encuentro esa sala');if(r.data.host_id===user.id||r.data.guest_id===user.id){room=r.data;return displayRoom()}if(r.data.guest_id||r.data.status!=='waiting')return msg('La sala ya está completa o comenzó');const u=await supa.from('duel_rooms').update({guest_id:user.id}).eq('id',r.data.id).is('guest_id',null).eq('status','waiting').select().single();if(u.error)return msg('No ha sido posible unirse: '+u.error.message);room=u.data;answers={};submitted=false;await displayRoom()}
function titles(){return '<div class="bar"><button class="btn" id="exit">← Salir</button><span class="pill">SALA '+esc(room.code)+'</span></div>'}
async function displayRoom(){await fetchRoom();await getResults();if(room.status==='waiting'){show('<div class="card">'+titles()+'<h1>⚔️ Duelo privado</h1><p>Código para compartir:</p><h1 style="font-size:48px;color:#6ce6ef;letter-spacing:6px">'+esc(room.code)+'</h1><button class="btn" id="copy">📋 Copiar código</button><div class="grid"><div class="card">👑 Anfitrión<br><b>'+room.host_id.slice(0,8)+'</b></div><div class="card">'+(room.guest_id?'✅ Rival conectado':'⌛ Esperando rival…')+'</div></div>'+(room.host_id===user.id?'<button class="btn primary" id="spin" '+(!room.guest_id?'disabled':'')+'>🎡 Girar ruleta y empezar</button>':'<p>El anfitrión girará la ruleta para elegir la categoría.</p>')+'</div><div class="card"><div class="wheelouter"><div class="pointer">▼</div><div class="wheel" id="wheel"></div></div><p style="text-align:center">La ruleta decide la categoría que jugaréis los dos.</p></div>');document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(room.code).then(()=>msg('Código copiado'));const sp=document.getElementById('spin');if(sp)sp.onclick=spin;document.getElementById('exit').onclick=exit;return}if(room.status==='playing'){await play();return}if(room.status==='finished')return final();}
function keysFor(cat){const q=BANK.filter(x=>x.sub===cat);for(let i=q.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[q[i],q[j]]=[q[j],q[i]]}return q.slice(0,5).map(x=>x.key)}
async function spin(){if(room.host_id!==user.id||!room.guest_id||spinner)return;spinner=true;const cats=CAT_VALID;const idx=crypto.getRandomValues(new Uint32Array(1))[0]%cats.length;let angle=1440+idx*360/cats.length;const w=document.getElementById('wheel');if(w)w.style.transform='rotate('+angle+'deg)';const cat=cats[idx][0],keys=keysFor(cat);await new Promise(r=>setTimeout(r,2350));const x=await supa.from('duel_rooms').update({status:'playing',category:cat,spin_value:idx,question_keys:keys,started_at:new Date().toISOString()}).eq('id',room.id).eq('status','waiting').select().single();spinner=false;if(x.error)return msg(x.error.message);room=x.data;answers={};lastQuestion=-1;await displayRoom()}
function questions(){return (room.question_keys||[]).map(k=>BANK.find(x=>x.key===k)).filter(Boolean)}
function questionIndex(){return Math.floor((Date.now()-new Date(room.started_at).getTime())/20000)}
async function play(){let q=questions();if(!q.length){show('<div class="card">Las preguntas de esta sala no están disponibles en esta versión. <button class="btn" id="exit">Salir</button></div>');document.getElementById('exit').onclick=exit;return}if(results.some(x=>x.user_id===user.id)){submitted=true;return final()}let ix=questionIndex();if(ix>=q.length){await submit();return}if(ix<0)ix=0;let sec=Math.max(0,20-Math.floor((Date.now()-new Date(room.started_at).getTime())/1000)%20);lastQuestion=ix;let cat=CAT.find(x=>x[0]===room.category);show('<div class="card">'+titles()+'<span class="pill">🎡 '+esc(cat?.[2]||room.category)+'</span><h1>Pregunta '+(ix+1)+' / '+q.length+'</h1><div class="count" id="seconds">'+sec+'s</div><h2>'+esc(q[ix].q[0])+'</h2><div class="options">'+q[ix].q[1].map((o,j)=>'<button class="option '+(answers[ix]?.choice===j?'selected':'')+'" data-choice="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button>').join('')+'</div><p class="muted">El tiempo avanza para ambos jugadores. Cada pregunta dura 20 segundos.</p></div>');document.getElementById('exit').onclick=exit;document.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>{answers[ix]={choice:Number(x.dataset.choice),remaining:Math.max(0,20-Math.floor((Date.now()-new Date(room.started_at).getTime())/1000)%20)};document.querySelectorAll('[data-choice]').forEach(b=>b.classList.remove('selected'));x.classList.add('selected')})}
async function submit(){if(submitted)return;submitted=true;let q=questions();let correct=q.filter((v,i)=>answers[i]?.choice===v.q[2]).length;let elapsed=Math.max(0,Math.min(600,Math.round((Date.now()-new Date(room.started_at).getTime())/1000)));let score=q.reduce((sum,v,i)=>sum+(answers[i]?.choice===v.q[2]?1000+Math.floor((answers[i]?.remaining||0)*25):0),0);const r=await supa.from('duel_results').upsert({room_id:room.id,user_id:user.id,correct,elapsed_seconds:elapsed,score},{onConflict:'room_id,user_id'});if(r.error){submitted=false;return msg('No se pudo guardar la puntuación: '+r.error.message)}if(correct>=3){const c=CAT.find(x=>x[0]===room.category);await supa.from('duel_collectibles').upsert({user_id:user.id,category:room.category,character_name:c?.[2]||'Personaje'},{onConflict:'user_id,category',ignoreDuplicates:true})}await getResults();final()}
function final(){const me=results.find(x=>x.user_id===user.id),other=results.find(x=>x.user_id!==user.id),cat=CAT.find(x=>x[0]===room.category);let note=!me?'Recuperando puntuación…':!other?'Tu rival todavía está jugando.':'¡Partida terminada!';show('<div class="card">'+titles()+'<h1>🏆 Resultado del duelo</h1><p class="pill">Categoría: '+esc(cat?.[2]||room.category)+'</p><div class="grid"><div class="card"><h2>👤 Tú</h2><h1>'+(me?.correct??'—')+'/5</h1><b>'+(me?.score??'—')+' puntos</b></div><div class="card"><h2>⚔️ Rival</h2><h1>'+(other?.correct??'—')+'/5</h1><b>'+(other?.score??'—')+' puntos</b></div></div><p>'+note+'</p>'+(me?.correct>=3?'<div class="card"><div class="figure">'+esc(cat?.[1]||'🏅')+'</div>🎉 ¡Has desbloqueado '+esc(cat?.[2]||'tu personaje')+'!</div>':'<p class="muted">Con 3 aciertos o más desbloqueas el personaje de esta categoría.</p>')+'<button class="btn primary" id="home">Volver a Arena</button></div>');document.getElementById('home').onclick=exit;document.getElementById('exit').onclick=exit}
function exit(){room=null;answers={};submitted=false;lastQuestion=-1;lobby()}
async function tick(){if(!room)return;await fetchRoom();if(room.status==='playing'){const ix=questionIndex();if(ix>=questions().length){if(!submitted)await submit();else{await getResults();final()}}else if(ix!==lastQuestion){await play()}else {const e=document.getElementById('seconds');if(e)e.textContent=Math.max(0,20-Math.floor((Date.now()-new Date(room.started_at).getTime())/1000)%20)+'s'}}else if(room.status==='waiting'){const e=document.getElementById('spin');if((room.guest_id&&!e)||(e&&e.disabled)){await displayRoom()}}else{await getResults();final()}}
try{const lib=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/+esm');supa=lib.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const u=await supa.auth.getUser();user=u.data.user;if(!user)basic();else{const r=await supa.from('duel_collectibles').select('category,character_name').eq('user_id',user.id);chars=r.data||[];lobby()}setInterval(()=>tick().catch(console.error),2300)}catch(e){console.error(e);show('<div class="card"><h1>Servicio temporalmente no disponible</h1><p>No se ha podido conectar con Supabase. Abre este enlace en Safari e inténtalo de nuevo.</p><a href="./">Volver al inicio</a></div>')}
</script></body></html>
