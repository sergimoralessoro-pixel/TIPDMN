<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radiolab Live · Quiz multijugador</title><meta name="theme-color" content="#071320"><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#071320;color:#ecfaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% -10%,#1b4556,#071320 60%);min-height:100vh}main{max-width:970px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-size:24px;font-weight:900}a{color:#64dce7}.card{border:1px solid #285266;border-radius:20px;padding:22px;margin:20px 0;background:#0e2637}.hero{background:linear-gradient(120deg,#0c4f68,#12263d)}.btn{background:#19475b;border:1px solid #38778a;border-radius:13px;color:white;padding:12px 18px;font:inherit;font-weight:750;cursor:pointer}.btn.primary{background:#44d9e5;color:#08222d;border-color:#44d9e5}.btn:disabled{opacity:.45}.field{background:#061b29;border:1px solid #41677a;color:white;padding:13px;border-radius:12px;width:100%;margin:10px 0 15px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.muted{color:#a9c5d0}.pill{padding:8px 13px;border-radius:25px;background:#205168;color:#a9eff4;display:inline-block}.count{font-size:52px;color:#4ee0ec;font-weight:900}.option{padding:17px;min-height:64px;border-radius:15px;border:0;color:white;font-size:17px;font-weight:700;text-align:left;cursor:pointer}.option:nth-child(1){background:#be404a}.option:nth-child(2){background:#2b74a9}.option:nth-child(3){background:#b58a28}.option:nth-child(4){background:#287f64}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.score{background:#143448;padding:14px;border-radius:12px;margin:8px 0}.gridp{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.notice{color:#f2d390;padding:13px;background:#4a3823;border-radius:12px}.big{font-size:40px;color:#83eff2;letter-spacing:5px;font-weight:850}p{line-height:1.6}@media(max-width:600px){.card{padding:16px}.gridp{grid-template-columns:1fr}.option{min-height:58px}} </style>
<style>
/* Kahoot a cuatro colores con revelación sincronizada */
.gridp{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:16px}
.option{display:flex;align-items:center;gap:15px;position:relative;min-height:93px;font-size:17px;transition:opacity .35s,filter .35s,transform .35s,box-shadow .35s;border:3px solid transparent}
.option-0{background:#da3545!important}.option-1{background:#2874d2!important}.option-2{background:#e1a918!important;color:#1b2635}.option-3{background:#238f63!important}
.option .option-symbol{font-size:29px;line-height:1;font-weight:1000;min-width:32px}
.option.is-selected:not(:disabled){outline:3px solid white}
.option.is-selected{border-color:white}
.option:disabled{cursor:default;opacity:1}
.option.is-dimmed{opacity:.24!important;filter:grayscale(.8);transform:scale(.98)}
.option.is-correct{opacity:1!important;z-index:1;border-color:#fff!important;box-shadow:0 0 12px 3px #fff,0 0 32px #b5ffff,0 0 48px #4cf5ff;animation:quiz-correct-pulse .75s ease-in-out infinite alternate}
.answer-check{margin-left:auto;font-size:30px;color:#fff;text-shadow:0 0 5px #000}
@keyframes quiz-correct-pulse{to{box-shadow:0 0 18px 6px #fff,0 0 46px 8px #8bfff4;filter:brightness(1.18)}}
.timer-row{justify-content:space-between;align-items:center;margin:15px 0}
.timer-circle{--progress:100%;width:94px;height:94px;flex:0 0 94px;border-radius:50%;background:conic-gradient(#51ecf2 var(--progress),#2b4555 var(--progress));padding:9px;display:grid;place-items:center;transform:rotate(-90deg);transition:background .3s;box-shadow:0 0 0 2px #4ad4dd33}
.timer-ring-inner{width:100%;height:100%;display:grid;place-items:center;border-radius:50%;background:#0b2336}
.timer-icon{font-size:32px;transform:rotate(90deg);animation:timer-spin 5s linear infinite}
.timer-circle.reveal{background:conic-gradient(#e4be5b 100%,#2b4555 0%)}.timer-circle.reveal .timer-icon{animation:none}
@keyframes timer-spin{to{transform:rotate(450deg)}}
@media(max-width:650px){main{padding:12px}.gridp{gap:9px}.option{min-height:90px;padding:11px 9px;font-size:13px;gap:7px}.option .option-symbol{font-size:21px;min-width:21px}.timer-circle{width:76px;height:76px;flex-basis:76px}.timer-icon{font-size:25px}}
@media(prefers-reduced-motion:reduce){.option.is-correct,.timer-icon{animation:none}}
</style></head><body><main><header class="top"><strong class="brand">🩻 RADIO<span style="color:#52d9ea">LAB</span> LIVE</strong><a href="./">← Academia</a></header><div id="app"><section class="card"><h1>Cargando sala de juego…</h1></section></div></main><script type="module">
import {subjects,lessons} from './content.js';
import {expandedLessons} from './extra-content.js';
import {classStudyBooks} from './class-books.js';
import {anatomyBookA} from './anatomy-book-a.js';
import {anatomyBookB} from './anatomy-book-b.js';
import {anatomyBookC} from './anatomy-book-c.js';
import {radiationTopics} from './radiation-topics.js';
import {additionalDriveBooks} from './additional-drive-books.js?v=2';
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './config.js';
const app=document.getElementById('app');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const study=[...anatomyBookA,...anatomyBookB,...anatomyBookC,...radiationTopics,...classStudyBooks.filter(l=>l.subject!=='proteccion'),...additionalDriveBooks,...lessons.filter(l=>!['anatomia','proteccion','ingles','atencion','forense','ipe1',...additionalDriveBooks.map(b=>b.subject)].includes(l.subject)),...expandedLessons.filter(l=>!['anatomia','proteccion','ingles','atencion','forense','ipe1',...additionalDriveBooks.map(b=>b.subject)].includes(l.subject))];const all=study.flatMap(l=>l.questions.map((q,i)=>({key:l.id+':'+i,subject:l.subject,q})));
let db=null,user=null,profile=null,room=null,players=[],answers=[],lastIndex=-1,lastAnswered=-1,finished=false,ticking=false;
const show=x=>app.innerHTML=x;const err=x=>alert(x);
const pool=()=>room.question_keys.map(key=>all.find(q=>q.key===key)).filter(Boolean);
const REVEAL_SECONDS=5;
const elapsed=()=>Math.max(0,(Date.now()-new Date(room.started_at).getTime())/1000);
const cycleLength=()=>room.seconds_per_question+REVEAL_SECONDS;
const index=()=>Math.floor(elapsed()/cycleLength());
const cycleSeconds=()=>elapsed()%cycleLength();
const revealPhase=()=>cycleSeconds()>=room.seconds_per_question;
const remaining=()=>Math.max(0,Math.ceil(room.seconds_per_question-cycleSeconds()));
const clockHtml=()=>'<div class="timer-circle" id="clock" role="progressbar" aria-label="Tiempo restante" aria-valuemax="27" aria-valuemin="0" aria-valuenow="'+remaining()+'" style="--progress:'+Math.max(0,remaining()/room.seconds_per_question*100)+'%"><div class="timer-ring-inner"><span class="timer-icon">⌛</span></div></div>';
function homepage(){show('<div class="card hero"><h1>🎯 Kahoot Radiolab</h1><p>Partidas en directo con código. Elige asignatura o preguntas aleatorias, comparte el código y competid por velocidad.</p><span class="pill">🩻 27 segundos por pregunta</span></div><div class="grid"><div class="card"><h2>🎤 Crear partida</h2><label>Banco de preguntas</label><select id="sub" class="field"><option value="random">🎲 Todas las asignaturas</option>'+subjects.map(s=>'<option value="'+s[0]+'">'+safe(s[1])+'</option>').join('')+'</select><button class="btn primary" id="create">Crear código</button></div><div class="card"><h2>🎫 Unirse a sala</h2><input id="code" class="field" maxlength="6" placeholder="CÓDIGO"><button class="btn primary" id="join">Entrar</button></div></div><div class="card"><h2>¿Cómo funciona?</h2><p>El anfitrión crea la sala, tus compañeros se unen y empiezan juntos. Cada pregunta dura 27 segundos. Los aciertos rápidos puntúan más.</p><p class="muted">Modalidad de práctica entre compañeros; los puntos no son una calificación oficial y no incluyen sistema antifraude.</p></div>');document.getElementById('create').onclick=create;document.getElementById('join').onclick=join}
async function load(){if(!room)return;let rs=await Promise.all([db.from('kahoot_rooms').select('*').eq('id',room.id).maybeSingle(),db.from('kahoot_players').select('*').eq('room_id',room.id),db.from('kahoot_answers').select('*').eq('room_id',room.id)]);if(rs[0].data)room=rs[0].data;players=rs[1].data||[];answers=rs[2].data||[]}
async function create(){const sub=document.getElementById('sub').value;const available=all.filter(x=>sub==='random'||x.subject===sub);if(available.length<3)return err('Esa asignatura necesita más preguntas');const code=Array.from(crypto.getRandomValues(new Uint8Array(6)),v=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[v%32]).join('');const r=await db.from('kahoot_rooms').insert({code,subject_id:sub,host_id:user.id,seconds_per_question:27}).select().single();if(r.error)return err(r.error.message);room=r.data;const p=await db.from('kahoot_players').insert({room_id:room.id,user_id:user.id,display_name:profile?.username||'Anfitrión',avatar:profile?.avatar||'🩻'});if(p.error)return err(p.error.message);await display()}
async function join(){let code=document.getElementById('code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))return err('Introduce los seis caracteres');const r=await db.from('kahoot_rooms').select('*').eq('code',code).maybeSingle();if(!r.data)return err('No existe esa sala');room=r.data;if(room.status!=='waiting')return err('La partida ya ha comenzado');const p=await db.from('kahoot_players').upsert({room_id:room.id,user_id:user.id,display_name:profile?.username||'Alumno',avatar:profile?.avatar||'🩻'},{onConflict:'room_id,user_id',ignoreDuplicates:true});if(p.error)return err(p.error.message);await display()}
function nav(){return '<div class="row"><button id="leave" class="btn">← Salir</button><span class="pill">SALA '+safe(room.code)+'</span></div>'}
function leave(){room=null;players=[];answers=[];lastIndex=-1;lastAnswered=-1;homepage()}
async function display(){await load();if(room.status==='waiting'){show('<div class="card">'+nav()+'<h1>🎯 Sala de Kahoot</h1><p>Comparte este código con tus compañeros:</p><div class="big">'+safe(room.code)+'</div><button class="btn" id="copy">📋 Copiar</button><h2>Jugadores ('+players.length+')</h2><div class="grid">'+players.map(p=>'<div class="score">'+safe(p.avatar)+' '+safe(p.display_name)+'</div>').join('')+'</div>'+(room.host_id===user.id?'<button class="btn primary" id="start" '+(players.length<2?'disabled':'')+'>▶️ Empezar partida</button>':'<p>Esperando a que el anfitrión inicie la partida.</p>')+'</div>');document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(room.code);const s=document.getElementById('start');if(s)s.onclick=start;document.getElementById('leave').onclick=leave;return}if(room.status==='playing'){play();return}}
async function start(){const sub=room.subject_id;const source=all.filter(x=>sub==='random'||x.subject===sub);let array=[...source];for(let i=array.length-1;i>0;i--){let j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[array[i],array[j]]=[array[j],array[i]]}const keys=array.slice(0,Math.min(10,array.length)).map(q=>q.key);const r=await db.from('kahoot_rooms').update({status:'playing',question_keys:keys,seconds_per_question:27,started_at:new Date().toISOString()}).eq('id',room.id).eq('status','waiting').select().single();if(r.error)return err(r.error.message);room=r.data;lastIndex=-1;await display()}
function play(){
 const q=pool(),i=index();
 if(i>=q.length){finish();return}
 if(i<0)return;
 lastIndex=i;
 const current=q[i],revealed=revealPhase();
 const myAnswer=answers.find(a=>a.question_index===i&&a.user_id===user.id);
 let options=current.q[1].map((x,j)=>'<button class="option option-'+j+(revealed?(j===current.q[2]?' is-correct':' is-dimmed'):(myAnswer?.choice===j?' is-selected':''))+'" data-choice="'+j+'" '+(myAnswer||revealed?'disabled':'')+'><span class="option-symbol">'+['▲','◆','●','■'][j]+'</span><span>'+safe(x)+'</span>'+(revealed&&j===current.q[2]?'<span class="answer-check">✓</span>':'')+'</button>').join('');
 show('<div class="card">'+nav()+'<span class="pill">Pregunta '+(i+1)+' de '+q.length+'</span><div class="row timer-row">'+clockHtml()+'<span class="pill">'+safe(subjects.find(s=>s[0]===current.subject)?.[1]||current.subject)+'</span></div><h1>'+safe(current.q[0])+'</h1><div class="gridp" id="answers">'+options+'</div><p id="status" class="muted">'+(revealed?'✨ Respuesta correcta iluminada. Siguiente pregunta en '+Math.ceil(cycleLength()-cycleSeconds())+'s.':myAnswer?'✅ Respuesta guardada. La solución se mostrará cuando termine el tiempo.':'Elige una respuesta. La solución aparecerá cuando termine el círculo de 27 segundos.')+'</p></div>');
 document.getElementById('leave').onclick=leave;
 if(!revealed)document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(i,Number(b.dataset.choice)));
}
async function answer(i,choice){
 if(i!==index()||lastAnswered===i||revealPhase())return;
 lastAnswered=i;
 document.querySelectorAll('[data-choice]').forEach(x=>x.disabled=true);
 const q=pool()[i];
 const correct=choice===q.q[2],sec=remaining();
 const points=correct?500+Math.floor(sec/room.seconds_per_question*500):0;
 const r=await db.from('kahoot_answers').insert({room_id:room.id,user_id:user.id,question_index:i,choice,correct,points});
 if(r.error){lastAnswered=-1;return err(r.error.message)}
 const st=document.getElementById('status');
 if(st)st.textContent='✅ Respuesta registrada. Espera al final de los 27 segundos para ver la solución.';
 const chosen=document.querySelector('[data-choice="'+choice+'"]');if(chosen)chosen.classList.add('is-selected');
}
function finish(){const scores=players.map(p=>({p,score:answers.filter(a=>a.user_id===p.user_id).reduce((n,a)=>n+a.points,0),correct:answers.filter(a=>a.user_id===p.user_id&&a.correct).length})).sort((a,b)=>b.score-a.score);show('<div class="card">'+nav()+'<h1>🏆 Podio Radiolab</h1><p>¡Partida terminada! '+pool().length+' preguntas.</p>'+scores.map((x,i)=>'<div class="score"><span class="pill">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1)+'</span> '+safe(x.p.avatar)+' <b>'+safe(x.p.display_name)+'</b> — '+x.score+' puntos · '+x.correct+' aciertos</div>').join('')+'<button class="btn primary" id="new">Nueva partida</button></div>');document.getElementById('leave').onclick=leave;document.getElementById('new').onclick=leave}
async function tick(){
 if(!room||ticking)return;ticking=true;
 try{
  await load();
  if(room.status==='waiting'){
   const badge=document.querySelector('.big');
   if(badge){
    const count=document.querySelector('h2');
    if(count&&!count.textContent.includes('('+players.length+')'))await display();
    const b=document.getElementById('start');if(b)b.disabled=players.length<2;
   }
  }else if(room.status==='playing'){
   const i=index(),q=pool();
   if(i>=q.length){finish();return}
   const stateKey=i+':'+(revealPhase()?'reveal':'answer');
   if(stateKey!==String(lastIndex)+':'+(app.querySelector('.is-correct')?'reveal':'answer'))play();
   else{
    const cl=document.getElementById('clock');
    if(cl){
     cl.style.setProperty('--progress',Math.max(0,remaining()/room.seconds_per_question*100)+'%');
     cl.setAttribute('aria-valuenow',remaining());
     cl.classList.toggle('reveal',revealPhase());
    }
    if(revealPhase()){
     const st=document.getElementById('status');
     if(st)st.textContent='✨ La respuesta correcta está iluminada. Próxima pregunta en '+Math.ceil(cycleLength()-cycleSeconds())+'s.';
    }
   }
  }
 }finally{ticking=false}
}
try{const lib=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/+esm');db=lib.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const x=await db.auth.getUser();user=x.data.user;if(!user)show('<div class="card hero"><h1>Inicia sesión para jugar</h1><p>Los juegos en directo usan tu cuenta de Radiolab.</p><a class="btn primary" href="./#auth">Entrar a Radiolab</a></div>');else{const p=await db.from('profiles').select('username,avatar').eq('id',user.id).maybeSingle();profile=p.data;homepage();setInterval(()=>tick().catch(console.error),1400);
 setInterval(()=>{
  if(!room||room.status!=='playing')return;
  const i=index(),phase=revealPhase();
  if(i!==lastIndex||(phase&&!document.querySelector('.option.is-correct'))){play();return;}
  const circle=document.getElementById('clock');
  if(circle){circle.style.setProperty('--progress',Math.max(0,remaining()/room.seconds_per_question*100)+'%');circle.setAttribute('aria-valuenow',remaining());circle.classList.toggle('reveal',phase);}
 },150)}}catch(e){console.error(e);show('<div class="card"><h2>No se pudo conectar el juego</h2><p>Ábrelo en Safari y vuelve a probar.</p><a href="./">Volver</a></div>')}
</script></body></html>
