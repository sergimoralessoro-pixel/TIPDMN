</script><script type="module">

const app=document.getElementById('app');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const study=[...anatomyBookA,...anatomyBookB,...anatomyBookC,...radiationTopics,...classStudyBooks.filter(l=>l.subject!=='proteccion'),...additionalDriveBooks,...lessons.filter(l=>!['anatomia','proteccion','ingles','atencion','forense','ipe1',...additionalDriveBooks.map(b=>b.subject)].includes(l.subject)),...expandedLessons.filter(l=>!['anatomia','proteccion','ingles','atencion','forense','ipe1',...additionalDriveBooks.map(b=>b.subject)].includes(l.subject))];const all=uniqueBank(augmentLessons(study).flatMap(l=>l.questions.map((q,i)=>({key:l.id+':'+i,subject:l.subject,q}))));
let db=null,user=null,profile=null,room=null,players=[],answers=[],lastIndex=-1,lastAnswered=-1,finished=false,ticking=false,pendingAnswer=false,soloAi=false,matchTimer=null,aiVoteAt=0,aiVoteQuestion=-1,rematchPollBusy=false,lastRematchPoll=0,finalRenderedRoom=null;

function wireSelector(){
 const checks=[...document.querySelectorAll('[data-quiz-subject]')],indicator=document.getElementById('quiz-subject-count'),icons=document.getElementById('kahoot-selected-icons'),num=document.getElementById('kahoot-selected-num');

  const chosen=checks.filter(x=>x.checked),n=chosen.length;
  indicator.textContent=n+' asignaturas seleccionadas · mínimo 1';

 };

}
const show=x=>app.innerHTML=x;const err=x=>alert(x);
const pool=()=>room.question_keys.map(key=>all.find(q=>q.key===key)).filter(Boolean).map((x,i)=>({...x,q:conciseGameQuestion(varyQuestion(x.q,rng('kahoot|'+room.code+'|'+x.key),i%4))}));
const REVEAL_SECONDS=5;

const index=()=>Math.min(Math.max(0,room.question_keys.length-1),Math.floor(elapsed()/cycleLength()));

function homepage(){soloAi=false;show('<div class="card hero"><h1>🎯 Kahoot Radiolab</h1><p>Partidas en directo con código. Selecciona una o varias asignaturas, comparte el código y competid por velocidad.</p><span class="pill">🩻 27 segundos por pregunta</span></div><div class="grid"><div class="card"><h2>🎤 Crear partida</h2>'+subjectSelector()+'<button class="btn primary" id="create">Crear código</button></div><div class="card"><h2>🎫 Unirse a sala</h2><input id="code" class="field" maxlength="6" placeholder="CÓDIGO"><button class="btn primary" id="join">Entrar</button></div></div><div class="card"><h2>🎮 Partidas rápidas</h2><p>Busca durante 30 segundos a un compañero con las mismas asignaturas seleccionadas. Si no aparece nadie, competirás contra una IA con esas asignaturas.</p><button class="btn primary" id="quickmatch">🔎 Jugar contra cualquiera</button> <button class="btn" id="soloai">🤖 Jugar contra la IA</button></div><div class="card"><h2>¿Cómo funciona?</h2><p>El anfitrión crea la sala, tus compañeros se unen y empiezan juntos. Cada pregunta dura 27 segundos. Los aciertos rápidos puntúan más.</p><p class="muted">Modalidad de práctica entre compañeros; los puntos no son una calificación oficial y no incluyen sistema antifraude.</p></div>');wireSelector();document.getElementById('create').onclick=create;document.getElementById('join').onclick=join;document.getElementById('quickmatch').onclick=quickMatch;document.getElementById('soloai').onclick=()=>{const ids=selectedQuizSubjects();if(ids)beginAi(ids)}}
async function load(){if(!room||soloAi)return;const id=room.id;let rs=await Promise.all([db.from('kahoot_rooms').select('*').eq('id',id).maybeSingle(),db.from('kahoot_players').select('*').eq('room_id',id),db.from('kahoot_answers').select('*').eq('room_id',id)]);if(!room||room.id!==id)return;if(rs[0].data)room=rs[0].data;players=rs[1].data||[];answers=rs[2].data||[]}
function beginAi(ids=null){if(!ids)ids=quizSubjects.map(s=>s[0]);if(matchTimer)clearTimeout(matchTimer);matchTimer=null;soloAi=true;const ai=AI_NAMES[Math.floor(Math.random()*AI_NAMES.length)];let src=all.filter(q=>ids.includes(q.subject));for(let i=src.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[src[i],src[j]]=[src[j],src[i]]}room={id:crypto.randomUUID(),code:'SOLOIA',host_id:user.id,subject_id:encodeSelection(ids),status:'playing',seconds_per_question:27,started_at:new Date().toISOString(),question_keys:drawVaried(src,Math.min(10,src.length),'radiolab.kahoot.history').map(x=>x.key)};players=[{user_id:user.id,display_name:profile?.username||'Tú',avatar:profile?.avatar||'🩻'},{user_id:AI_ID,display_name:ai,avatar:'🤖'}];answers=[];lastIndex=-1;lastAnswered=-1;aiVoteQuestion=-1;play()}
async function quickMatch(){const ids=selectedQuizSubjects();if(!ids)return;try{soloAi=false;const r=await db.rpc('kahoot_quickmatch',{p_name:profile?.username||'Alumno',p_avatar:profile?.avatar||'🩻',p_subject_choice:encodeSelection(ids)});if(r.error)return err('Error buscando rival: '+r.error.message);room=r.data;await display();if(players.length>=2)return;matchTimer=setTimeout(async()=>{if(!room||room.id!==r.data.id||room.status!=='waiting'||soloAi)return;await load();if(players.length>=2){if(room.host_id===user.id)await start();else await display();return}const cancel=await db.rpc('kahoot_cancel_quickmatch',{p_room:room.id});if(cancel.error){err('No se pudo cerrar la búsqueda: '+cancel.error.message);return}await load();if(players.length>=2){if(room.host_id===user.id)await start();else await display();return}beginAi(ids)},30000)}catch(e){err('Error buscando rival: '+e.message)}}
async function create(){const ids=selectedQuizSubjects();if(!ids)return;const sub=encodeSelection(ids);const available=all.filter(x=>ids.includes(x.subject));if(available.length<3)return err('Esa asignatura necesita más preguntas');const code=Array.from(crypto.getRandomValues(new Uint8Array(6)),v=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[v%32]).join('');const r=await db.from('kahoot_rooms').insert({code,subject_id:sub,host_id:user.id,seconds_per_question:27}).select().single();if(r.error)return err(r.error.message);room=r.data;const p=await db.from('kahoot_players').insert({room_id:room.id,user_id:user.id,display_name:profile?.username||'Anfitrión',avatar:profile?.avatar||'🩻'});if(p.error)return err(p.error.message);await display()}
async function join(){let code=document.getElementById('code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))return err('Introduce los seis caracteres');const r=await db.from('kahoot_rooms').select('*').eq('code',code).maybeSingle();if(!r.data)return err('No existe esa sala');room=r.data;if(room.status!=='waiting')return err('La partida ya ha comenzado');const p=await db.from('kahoot_players').upsert({room_id:room.id,user_id:user.id,display_name:profile?.username||'Alumno',avatar:profile?.avatar||'🩻'},{onConflict:'room_id,user_id',ignoreDuplicates:true});if(p.error)return err(p.error.message);await display()}
function nav(){return '<div class="row"><button id="leave" class="btn">← Salir</button><span class="pill">SALA '+safe(room.code)+'</span></div>'}
function leave(){if(matchTimer)clearTimeout(matchTimer);matchTimer=null;soloAi=false;room=null;players=[];answers=[];lastIndex=-1;lastAnswered=-1;pendingAnswer=false;finalRenderedRoom=null;lastRematchPoll=0;homepage()}
async function display(){await load();if(room.status==='waiting'){show('<div class="card">'+nav()+'<h1>🎯 Sala de Kahoot</h1><p>Asignaturas: '+decodeSelection(room.subject_id).map(id=>safe(subjects.find(s=>s[0]===id)?.[1]||id)).join(', ')+'</p><p>Comparte este código con tus compañeros:</p><div class="big">'+safe(room.code)+'</div><button class="btn" id="copy">📋 Copiar</button><h2>Jugadores ('+players.length+')</h2><div class="grid">'+players.map(p=>'<div class="score">'+safe(p.avatar)+' '+safe(p.display_name)+'</div>').join('')+'</div>'+(room.host_id===user.id?'<button class="btn primary" id="start" '+(players.length<2?'disabled':'')+'>▶️ Empezar partida</button>':'<p>Esperando a que el anfitrión inicie la partida.</p>')+'</div>');document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(room.code);const s=document.getElementById('start');if(s)s.onclick=start;document.getElementById('leave').onclick=leave;return}if(room.status==='playing'){play();return}}
async function start(){const selected=decodeSelection(room.subject_id);const source=all.filter(x=>selected.includes(x.subject));let array=[...source];for(let i=array.length-1;i>0;i--){let j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[array[i],array[j]]=[array[j],array[i]]}const keys=drawVaried(array,Math.min(10,array.length),'radiolab.kahoot.history').map(q=>q.key);const r=await db.from('kahoot_rooms').update({status:'playing',question_keys:keys,seconds_per_question:27,started_at:new Date().toISOString()}).eq('id',room.id).eq('status','waiting').select().single();if(r.error)return err(r.error.message);room=r.data;lastIndex=-1;await display()}
function play(){
 const q=pool(),i=index();
 if(gameFinished()){finish();return}
 if(i<0)return;
 lastIndex=i;
 const current=q[i],revealed=revealPhase();
 const myAnswer=answers.find(a=>a.question_index===i&&a.user_id===user.id);
 let options=current.q[1].map((x,j)=>'<button class="option option-'+j+(revealed?(j===current.q[2]?' is-correct':' is-dimmed'):(myAnswer?.choice===j?' is-selected':''))+'" data-choice="'+j+'" '+(myAnswer||revealed?'disabled':'')+'><span class="option-symbol">'+['▲','◆','●','■'][j]+'</span><span>'+safe(x)+'</span>'+(revealed&&j===current.q[2]?'<span class="answer-check">✓</span>':'')+(revealed?'<span class="vote-count" data-vote-count="'+j+'" aria-label="'+answers.filter(a=>a.question_index===i&&a.choice===j).length+' votos">'+answers.filter(a=>a.question_index===i&&a.choice===j).length+'</span>':'')+'</button>').join('');
 show('<div class="card">'+nav()+'<span class="pill">Pregunta '+(i+1)+' de '+q.length+'</span><div class="row timer-row">'+clockHtml()+'<span class="pill">'+safe(subjects.find(s=>s[0]===current.subject)?.[1]||current.subject)+'</span></div><h1>'+safe(current.q[0])+'</h1>'+visualQuestionMedia(current.q)+'<div class="gridp" id="answers">'+options+'</div><p id="status" class="muted">'+(revealed?'✨ Respuesta correcta iluminada. Siguiente pregunta en '+Math.ceil(cycleLength()-cycleSeconds())+'s.':myAnswer?'✅ Respuesta guardada. La solución se mostrará cuando termine el tiempo.':'Elige una respuesta. La solución aparecerá cuando termine el círculo de 27 segundos.')+'</p>'+(revealed?'<p class="vote-summary" id="vote-summary">👥 '+answers.filter(a=>a.question_index===i).length+' respuestas recibidas · votos anónimos por opción</p>':'')+'</div>');
 document.getElementById('leave').onclick=leave;
 if(!revealed)document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(i,Number(b.dataset.choice)));
}
function syncFinishedKahootMistakes(){
 if(!room||room.status!=='playing'||!user)return;
 const keys=room.question_keys||[],passed=elapsed();
 // Una pregunta no respondida se registra después de su fase de revelación,
 // dejando margen a que Supabase reciba cualquier respuesta enviada al límite.
 for(let i=0;i<keys.length;i++){
  if(passed<(i+1)*cycleLength())break;
  const answer=answers.find(a=>a.question_index===i&&a.user_id===user.id);
  if(!answer||!answer.correct){
   const key=keys[i];
   if(all.some(x=>x.key===key))void recordGameMistake(db,user,key,'kahoot|'+room.id+'|'+i);
  }
 }
}
async function answer(i,choice){

 document.querySelectorAll('[data-choice]').forEach(x=>x.disabled=true);
 const q=pool()[i];

 const points=correct?500+Math.floor(sec/room.seconds_per_question*500):0;
 const r=soloAi?{error:null}:await db.from('kahoot_answers').insert({room_id:room.id,user_id:user.id,question_index:i,choice,correct,points});
 if(soloAi)answers.push({room_id:room.id,user_id:user.id,question_index:i,choice,correct,points});
 pendingAnswer=false;
 if(!r.error&&!correct)void recordGameMistake(db,user,q.key,'kahoot|'+room.id+'|'+i);
 if(r.error){lastAnswered=-1;document.querySelectorAll('[data-choice]').forEach(x=>x.disabled=revealPhase());const st=document.getElementById('status');if(st)st.textContent='⚠️ No se pudo guardar la respuesta. Inténtalo otra vez antes de que termine el tiempo.';return err(r.error.message)}
 const st=document.getElementById('status');
 if(st)st.textContent='✅ Respuesta registrada. Espera al final de los 27 segundos para ver la solución.';
 const chosen=document.querySelector('[data-choice="'+choice+'"]');if(chosen)chosen.classList.add('is-selected');
}
async function requestRematch(vote=false){
 if(!room||!document.getElementById('rematch-panel')||rematchPollBusy)return;
 if(soloAi){if(vote)beginAi(decodeSelection(room.subject_id));return;}
 const old=room.id;rematchPollBusy=true;
 try{
  const {data,error}=await db.rpc('game_rematch',{p_kind:'kahoot',p_room:old,p_vote:vote});
  if(!room||room.id!==old)return;
  const button=document.getElementById('rematch'),label=document.getElementById('rematch-status');
  if(error){if(label)label.textContent='No se pudo gestionar la revancha: '+error.message;return;}
  if(data.state==='ready'){
   const r=await db.from('kahoot_rooms').select('*').eq('id',data.new_room).maybeSingle();
   if(room?.id!==old)return;
   if(r.data){room=r.data;finalRenderedRoom=null;lastIndex=-1;lastAnswered=-1;pendingAnswer=false;finished=false;await display();return}
  }
  if(button){button.disabled=data.state==='expired'||data.voted;button.style.display=data.state==='expired'?'none':'';button.textContent=data.voted?'✅ Revancha solicitada':'🔁 Revancha';}
  if(label)label.textContent=data.state==='expired'?'Tiempo agotado. Pulsa Salir.':data.state==='waiting'?'Esperando al otro jugador: '+data.seconds+' s.':'Ambos debéis aceptar: 30 segundos desde la primera solicitud.';
 }finally{rematchPollBusy=false}
}
function finish(){
 syncFinishedKahootMistakes();
 if(!room||finalRenderedRoom===room.id&&document.getElementById('rematch-panel'))return;
 finalRenderedRoom=room.id;
 const scores=players.map(p=>({p,score:answers.filter(a=>a.user_id===p.user_id).reduce((n,a)=>n+a.points,0),correct:answers.filter(a=>a.user_id===p.user_id&&a.correct).length})).sort((a,b)=>b.score-a.score);
 show('<div class="card">'+nav()+'<h1>🏆 Podio Radiolab</h1><p>¡Partida terminada! '+pool().length+' preguntas.</p>'+scores.map((x,i)=>'<div class="score"><span class="pill">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1)+'</span> '+safe(x.p.avatar)+' <b>'+safe(x.p.display_name)+'</b> — '+x.score+' puntos · '+x.correct+' aciertos</div>').join('')+'<div id="rematch-panel"><button class="btn primary" id="rematch">🔁 Revancha</button><p class="muted" id="rematch-status">Ambos jugadores deben aceptar en 30 segundos.</p></div><button class="btn" id="new">Salir al inicio de Kahoot</button></div>');
 document.getElementById('leave').onclick=leave;
 document.getElementById('new').onclick=leave;
 document.getElementById('rematch').onclick=()=>requestRematch(true);
 if(!soloAi)requestRematch(false).catch(console.error);
}
async function tick(){
 if(!room||ticking)return;ticking=true;
 try{
  await load();
  if(!room)return;
  syncFinishedKahootMistakes();
  if(document.getElementById('rematch-panel')&&Date.now()-lastRematchPoll>1800){lastRematchPoll=Date.now();requestRematch(false).catch(console.error)}
  if(room.status==='waiting'){
   if(room.subject_id==='quickmatch'&&players.length>=2&&room.host_id===user.id){if(matchTimer)clearTimeout(matchTimer);matchTimer=null;await start();return}
   const badge=document.querySelector('.big');
   if(badge){
    const count=document.querySelector('h2');
    if(count&&!count.textContent.includes('('+players.length+')'))await display();
    const b=document.getElementById('start');if(b)b.disabled=players.length<2;
   }
  }else if(room.status==='playing'){
   const i=index(),q=pool();
   if(soloAi&&i<q.length&&!revealPhase()){
    if(aiVoteQuestion!==i){aiVoteQuestion=i;aiVoteAt=3+Math.floor(Math.random()*20)}
    if(cycleSeconds()>=aiVoteAt&&!answers.some(a=>a.user_id===AI_ID&&a.question_index===i)){
     const correct=Math.random()<0.64;const choice=correct?q[i].q[2]:(q[i].q[2]+1+Math.floor(Math.random()*3))%4;
     answers.push({room_id:room.id,user_id:AI_ID,question_index:i,choice,correct,points:correct?500+Math.floor((room.seconds_per_question-cycleSeconds())/room.seconds_per_question*500):0});
    }
   }
   if(gameFinished()){finish();return}
   const stateKey=i+':'+(revealPhase()?'reveal':'answer');
   if(stateKey!==String(lastIndex)+':'+(app.querySelector('.is-correct')?'reveal':'answer'))play();
   else{
    const cl=document.getElementById('clock');
    if(cl){
     cl.style.setProperty('--progress',Math.max(0,remaining()/room.seconds_per_question*100)+'%');
     cl.setAttribute('aria-valuenow',remaining());
     cl.classList.toggle('reveal',revealPhase());
    }
    if(revealPhase()){
     document.querySelectorAll('[data-vote-count]').forEach(el=>{const j=Number(el.dataset.voteCount),n=answers.filter(a=>a.question_index===i&&a.choice===j).length;el.textContent=String(n);el.setAttribute('aria-label',n+' votos');});
     const summary=document.getElementById('vote-summary');if(summary)summary.textContent='👥 '+answers.filter(a=>a.question_index===i).length+' respuestas recibidas · votos anónimos por opción';
     const st=document.getElementById('status');
     if(st)st.textContent='✨ La respuesta correcta está iluminada. Próxima pregunta en '+Math.ceil(cycleLength()-cycleSeconds())+'s.';
    }
   }
  }
 }finally{ticking=false}
}
try{const lib=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/+esm');db=lib.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const x=await db.auth.getUser();user=x.data.user;if(!user)show('<div class="card hero"><h1>Inicia sesión para jugar</h1><p>Los juegos en directo usan tu cuenta de Radiolab.</p><a class="btn primary" href="./#auth">Entrar a Radiolab</a></div>');else{const p=await db.from('profiles').select('username,avatar').eq('id',user.id).maybeSingle();profile=p.data;homepage();setInterval(()=>tick().catch(console.error),1400);
 setInterval(()=>{
  if(!room||room.status!=='playing')return;
  const i=index(),phase=revealPhase();
  if(i!==lastIndex||(phase&&!document.querySelector('.option.is-correct'))){play();return;}
  const circle=document.getElementById('clock');
  if(circle){circle.style.setProperty('--progress',Math.max(0,remaining()/room.seconds_per_question*100)+'%');circle.setAttribute('aria-valuenow',remaining());circle.classList.toggle('reveal',phase);}
 },150)}}catch(e){console.error(e);show('<div class="card"><h2>No se pudo conectar el juego</h2><p>Ábrelo en Safari y vuelve a probar.</p><a href="./">Volver</a></div>')}
</script></body></html>
