:root{font-family:system-ui,-apple-system,sans-serif;background:#071320;color:#edfaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#16435a,#071320 55%);min-height:100vh}main{max-width:960px;margin:auto;padding:22px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-size:24px;font-weight:850;color:#f0fdff}.brand span{color:#3adef0}a{color:#5bdfef}.card{border:1px solid #285266;background:#10283a;border-radius:22px;padding:24px;margin:18px 0}.hero{background:linear-gradient(120deg,#135370,#11273d);padding:32px}.muted{color:#a4c5d6}.btn{border:1px solid #37647a;background:#173b50;color:#edfaff;border-radius:13px;font-weight:700;padding:12px 17px;cursor:pointer}.btn.primary{background:#36d7e9;color:#062131;border-color:#36d7e9}.btn:disabled{opacity:.42;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.field{width:100%;border:1px solid #3d6175;background:#081d2d;color:white;padding:12px;border-radius:11px;margin:10px 0 16px;font:inherit}.pill{display:inline-block;background:#1b4b60;color:#8df0f0;padding:8px 13px;border-radius:20px}.wheel{width:min(320px,75vw);aspect-ratio:1;border-radius:50%;border:10px solid #32637a;margin:24px auto;box-shadow:0 0 0 6px #10374b,0 0 50px #09adc933;background:conic-gradient(#22c7db 0 36deg,#2f81c7 36deg 72deg,#9c73d6 72deg 108deg,#ec9f4b 108deg 144deg,#46b797 144deg 180deg,#d96888 180deg 216deg,#248ba1 216deg 252deg,#a0b345 252deg 288deg,#a86ca8 288deg 324deg,#2eaa84 324deg 360deg);display:grid;place-items:center;transition:transform 2.3s cubic-bezier(.17,.8,.18,1)}.wheel:before{content:'🩻';background:#092333;border:5px solid white;border-radius:50%;font-size:40px;width:90px;height:90px;display:grid;place-items:center}.wheel-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:25px}.wheel-item{display:flex;align-items:center;gap:10px;background:#102e42;padding:10px;border-radius:12px;border:1px solid #2e5267}.wheel-item>span{font-size:27px}.wheel-item b{display:block;font-size:13px}.wheel-item small{display:block;font-size:11px;color:#95c9d6;margin-top:3px}.wheel-item.locked{opacity:.5}.wheelouter{text-align:center}.pointer{font-size:33px;margin-bottom:-22px;position:relative;z-index:1}.options{display:grid;gap:10px}.option{text-align:left;padding:15px;border:1px solid #36596b;color:#eef9ff;background:#122f41;border-radius:13px;font-size:16px;cursor:pointer}.option.selected{border-color:#43e4f0;background:#18566b}.head{font-size:30px;margin:0 0 8px}.figure{font-size:50px}.count{font-size:45px;font-weight:900;color:#63e9ef}.ok{color:#87efa7}.error{color:#ffb2b2}.hidden{display:none}.notice{background:#3e2b22;padding:14px;border-radius:12px;color:#ffcfad}.collection{display:flex;gap:9px;flex-wrap:wrap}.figurecard{border:1px solid #366375;padding:16px;border-radius:15px;text-align:center;min-width:110px;background:#102c40}.figures{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}label{font-weight:700}p{line-height:1.55}@media(max-width:600px){.card{padding:17px}.hero{padding:21px}.head{font-size:25px}}</style>

</style></head><body><main><div class="bar"><div class="brand">🩻 RADIO<span>LAB</span> <small style="font-weight:400;font-size:13px">ARENA</small></div><a href="./">← Volver a la academia</a></div><div id="app"><div class="card hero"><h1>🎡 Duelos con ruleta</h1><p>Cargando la arena...</p></div></div></main><script type="module">
import {subjects,lessons} from './content.js';
import {augmentLessons,uniqueBank,drawVaried,varyQuestion,rng,conciseGameQuestion} from './quiz-variety.js';
import {visualQuestionMedia} from './visual-questions.js';
import {expandedLessons} from './extra-content.js';
import {classStudyBooks} from './class-books.js';
import {radiationTopics} from './radiation-topics.js';
import {additionalDriveBooks} from './additional-drive-books.js?v=2';
import {anatomyBookA} from './anatomy-book-a.js';
import {anatomyBookB} from './anatomy-book-b.js';
import {anatomyBookC} from './anatomy-book-c.js';
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './config.js';
const el=document.getElementById('app'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
const course=[...anatomyBookA,...anatomyBookB,...anatomyBookC,...radiationTopics,...classStudyBooks.filter(x=>x.subject!=='proteccion'),...additionalDriveBooks,...lessons.filter(x=>!['anatomia','ingles','atencion','forense','ipe1','proteccion',...additionalDriveBooks.map(b=>b.subject)].includes(x.subject)),...expandedLessons.filter(x=>!['anatomia','ingles','atencion','forense','ipe1','proteccion',...additionalDriveBooks.map(b=>b.subject)].includes(x.subject))];
const bank=uniqueBank(augmentLessons(course).flatMap(l=>(l.questions||[]).map((q,i)=>({key:l.id+':'+i,sub:l.subject,q}))));
const categories=subjects.map(x=>({id:x[0],name:x[1],emoji:x[2],pool:bank.filter(y=>y.sub===x[0])})).filter(x=>x.pool.length>=10);
const palette=['#30c6cf','#517dde','#ad78ce','#f2a854','#4bb894','#df739f','#3c9cca','#adc15c','#c278b9','#2fc7a6','#f18b62','#728bd2','#bd78df','#ddba5b','#44b3ca','#bf80af','#92a5ca'];
const names=Object.fromEntries(categories.map(x=>[x.id,x.name]));
let supa,user,room=null,active=[],profiles={},busy=false,animating=false,polling=false,channel=null,gameError='',spinAngle=0,aiRoom=false,matchTimer=null,aiBusy=false,rematchPollBusy=false,lastRematchPoll=0;
const AI_ID='00000000-0000-4000-8000-000000000001';
const AI_NAMES=['🦊 Vega Rad','🤖 Dr. Pixel','🐙 Neutrón','🦉 Rayito','🐼 La Doctora','👾 Tecno-X','🦋 Nébula','🐸 Profe Gamma'];
const byId=id=>categories.find(x=>x.id===id);
const timeLeft=()=>room?Math.max(0,Math.ceil((new Date(room.expires_at).getTime()-Date.now())/1000)):0;
const questionLeft=()=>room?.question_started_at?Math.max(0,Math.ceil((new Date(room.question_started_at).getTime()+30000-Date.now())/1000)):0;
const emojiOf=(cat,count)=>{const n=Math.min(3,Math.max(0,Number(count)||0));return '<span class="badge-symbol progress-emoji" style="--emoji-fill:'+(n/3*100)+'%" title="'+esc(cat.name)+': '+n+'/3 aciertos" aria-label="'+esc(cat.name)+': '+n+' de 3 aciertos"><span class="emoji-shadow" aria-hidden="true">'+cat.emoji+'</span><span class="emoji-fill" aria-hidden="true">'+cat.emoji+'</span><span class="emoji-segments" aria-hidden="true"><i></i><i></i><i></i></span></span>'};
function status(n){gameError=n;const a=document.querySelector('#feedback');if(a){a.textContent=n;a.style.display=n?'block':'none';}else if(n)console.warn(n)}
function show(a){
 const oldScroll=window.scrollY;
 const openReviews=new Set([...el.querySelectorAll('details[data-review][open]')].map(d=>d.dataset.review));
 const openScores=new Set([...el.querySelectorAll('details[data-score][open]')].map(d=>d.dataset.score));
 el.innerHTML=a;
 el.querySelectorAll('details[data-review]').forEach(d=>{if(openReviews.has(d.dataset.review))d.open=true});
 el.querySelectorAll('details[data-score]').forEach(d=>{if(openScores.has(d.dataset.score))d.open=true});
 if(gameError)status(gameError);
 // Mantener la posición al redibujar el turno, sin desplazar al jugador arriba.
 window.scrollTo({top:oldScroll,behavior:'instant'});
}
const reviewStorageKey=()=> 'radiolab.duel.mistakes.'+(user?.id||'guest');
function savedMistakes(){try{const v=JSON.parse(localStorage.getItem(reviewStorageKey())||'[]');return Array.isArray(v)?v:[]}catch{return []}}
function rememberMistake(){
 const l=room?.last_result;
 if(!user||!l?.question_key||l.user_id!==user.id||l.correct)return;
 const key=room.id+':'+l.question_key;
 const existing=savedMistakes();if(existing.some(x=>x.key===key))return;
 const original=bank.find(x=>x.key===l.question_key);if(!original)return;
 const q=conciseGameQuestion(varyQuestion(original.q,rng('duel|'+room.code+'|'+original.key),1));
 const chosen=Number(l.choice);
 const row={key,room:room.id,category:names[original.sub]||original.sub,question:q[0],options:q[1],correct:q[2],choice:Number.isInteger(chosen)&&chosen>=0&&chosen<q[1].length?chosen:-1,explanation:q[3]||'Repasa la opción correcta y su relación con el enunciado.',date:new Date().toISOString()};
 try{localStorage.setItem(reviewStorageKey(),JSON.stringify([row,...existing].slice(0,100)))}catch(e){console.warn('No se pudo guardar el historial de fallos',e)}
}
function mistakesReview(onlyRoom=false){
 const entries=savedMistakes().filter(x=>!onlyRoom||x.room===room?.id);
 const cards=entries.map(x=>'<details data-review="'+esc(x.key)+'" class="review-item"><summary>❌ '+esc(x.category)+' · '+esc(x.question)+'</summary><div class="review-content"><p><strong>Pregunta:</strong> '+esc(x.question)+'</p><p>❌ <strong>Tu respuesta:</strong> '+(x.choice>=0?esc(x.options[x.choice]):'No respondiste a tiempo')+'</p><p class="ok">✅ <strong>Respuesta correcta:</strong> '+esc(x.options[x.correct])+'</p><p>💡 <strong>Explicación:</strong> '+esc(x.explanation)+'</p><small class="muted">'+new Date(x.date).toLocaleString('es-ES')+'</small></div></details>').join('');
 return '<section class="card review-history"><h2>📚 Mis fallos y correcciones ('+entries.length+')</h2><p class="muted">Pulsa la flechita para consultar tu respuesta, la correcta y la explicación. Los fallos se guardan en este navegador.</p>'+(cards||'<p class="muted">Todavía no has fallado ninguna pregunta'+(onlyRoom?' en esta partida':'')+'.</p>')+'</section>';
}
async function rpc(fn,args){if(aiRoom&&['duel_spin','duel_answer','duel_expire'].includes(fn))return localAiRpc(fn,args);const r=await supa.rpc(fn,args);if(r.error)throw Error(r.error.message);return r.data}
function localAiRpc(fn,a){if(!room||!aiRoom)throw Error('La partida de IA no está activa');if(fn==='duel_expire'){room.status='expired';return room}if(fn==='duel_spin'){if(room.question_key)throw Error('Ya hay una pregunta activa');room.status='playing';room.current_turn=room.current_turn||user.id;room.category=a.p_category;room.question_key=a.p_question_key;room.correct_index=a.p_correct_index;room.question_started_at=new Date().toISOString();room.question_keys.push(a.p_question_key);room.revision++;return room}if(fn==='duel_answer'){if(room.question_key!==a.p_question_key)return room;const correct=a.p_choice===room.correct_index&&Date.now()<new Date(room.question_started_at).getTime()+30000;const actor=room.current_turn;if(correct){const id=String(actor),prog=room.category_progress[id]||{};prog[room.category]=(prog[room.category]||0)+1;room.category_progress[id]=prog;if(prog[room.category]>=3){room.awards[id]??={};room.awards[id][room.category]=true}}room.last_result={user_id:actor,correct,category:room.category,answer:room.correct_index,choice:a.p_choice,question_key:room.question_key};room.current_turn=correct?actor:(actor===user.id?AI_ID:user.id);room.question_key=null;room.question_started_at=null;room.correct_index=null;room.revision++;if(room.current_turn===AI_ID)scheduleAi();return room}return room}
function beginAi(){if(matchTimer){clearTimeout(matchTimer);matchTimer=null}aiRoom=true;const chosen=AI_NAMES[randomOf(AI_NAMES.length)];profiles[AI_ID]=chosen;room={id:crypto.randomUUID(),code:'SOLOIA',host_id:user.id,guest_id:AI_ID,status:'playing',current_turn:user.id,created_at:new Date().toISOString(),expires_at:new Date(Date.now()+7200000).toISOString(),revision:0,category_progress:{},awards:{},question_keys:[],question_key:null,last_result:{},question_started_at:null};renderRoom()}
function scheduleAi(){if(!aiRoom||aiBusy||room?.current_turn!==AI_ID)return;aiBusy=true;setTimeout(()=>{try{if(!aiRoom||!room||room.current_turn!==AI_ID||room.status!=='playing')return;const used=new Set(room.question_keys||[]),cats=categories.filter(c=>c.pool.some(q=>!used.has(q.key)));if(!cats.length){room.status='finished';renderRoom();return}const cat=cats[randomOf(cats.length)],pool=cat.pool.filter(q=>!used.has(q.key)),base=pool[randomOf(pool.length)],q={...base,q:varyQuestion(base.q,rng('duel|'+room.code+'|'+base.key),1)};localAiRpc('duel_spin',{p_category:cat.id,p_question_key:q.key,p_correct_index:q.q[2]});renderRoom();const delay=2500+randomOf(8500);setTimeout(()=>{if(!aiRoom||!room||room.current_turn!==AI_ID||room.question_key!==q.key)return;const hits=Math.random()<.63,choice=hits?q.q[2]:(q.q[2]+1+randomOf(3))%4;localAiRpc('duel_answer',{p_choice:choice,p_question_key:q.key});renderRoom()},delay)}finally{aiBusy=false}},850+randomOf(1550))}
async function quickMatch(){if(busy)return;busy=true;try{aiRoom=false;const found=await rpc('duel_quickmatch',{});await openRoom(found);if(found.guest_id){status('✅ Rival encontrado. Comienza el creador de la sala.');return}matchTimer=setTimeout(async()=>{if(!room||room.id!==found.id||room.guest_id||room.status!=='waiting')return;try{const result=await rpc('duel_cancel_quickmatch',{p_room:found.id});if(room?.id!==found.id)return;if(result.guest_id){await openRoom(result);return}beginAi();status('🤖 No apareció otro jugador en 30 segundos: juegas contra la IA.')}catch(e){status('No se pudo completar la búsqueda: '+e.message)}},30000);status('🔎 Buscando a otro alumno durante 30 segundos…') }catch(e){alert('No se pudo buscar rival: '+e.message)}finally{busy=false}}
function wheel(){
 const slice=360/categories.length;
 const gradient='conic-gradient('+categories.map((c,i)=>palette[i%palette.length]+' '+i*slice+'deg '+(i+1)*slice+'deg').join(',')+')';
 const icons=categories.map((c,i)=>{let deg=(i+.5)*slice;return '<span class="wheel-icon" title="'+esc(c.name)+'" style="transform:rotate('+deg+'deg) translateY(-112px) rotate(-'+deg+'deg)">'+c.emoji+'</span>'}).join('');
 return '<div class="wheelouter"><div class="pointer">▼</div><div class="wheel" id="wheel" style="background:'+gradient+';transform:rotate('+spinAngle+'deg)"><div class="wheel-icons">'+icons+'</div><div class="wheel-middle">🩻</div></div></div><div class="wheel-legend">'+categories.map(x=>'<div class="wheel-item"><span>'+x.emoji+'</span><div><b>'+esc(x.name)+'</b></div></div>').join('')+'</div>';
}
function badgeLine(id){
 const progress=room?.category_progress?.[id]||{};
 return '<div class="badge-line">'+categories.map(cat=>emojiOf(cat,progress[cat.id]||((room?.awards?.[id]||{})[cat.id]?3:0))).join('')+'</div>';
}
function scoreCard(id,title){
 const progress=room?.category_progress?.[id]||{};
 const awards=room?.awards?.[id]||{};
 const total=Object.values(progress).reduce((a,b)=>a+Number(b||0),0);
 const acquired=categories.filter(cat=>awards[cat.id]||Number(progress[cat.id]||0)>=3).length;
 const ordered=[...categories].sort((a,b)=>Number(progress[b.id]||0)-Number(progress[a.id]||0)||a.name.localeCompare(b.name,'es'));
 const cells=ordered.map(cat=>{
  const count=Math.max(0,Number(progress[cat.id]||0)),earned=Boolean(awards[cat.id]||count>=3);
  return '<div style="padding:9px 0;border-bottom:1px solid #54718245"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="display:inline-flex;align-items:center;gap:8px">'+emojiOf(cat,count)+' '+esc(cat.name)+'</span><strong style="white-space:nowrap">'+count+' acierto'+(count===1?'':'s')+' '+(earned?'🏅':'')+'</strong></div><div style="display:flex;align-items:center;gap:8px;margin-top:5px"><small>'+(earned?'Emoji conseguido':'Faltan '+Math.max(0,3-count)+' para el emoji')+'</small></div></div>';
 }).join('');
 const top=ordered.filter(cat=>Number(progress[cat.id]||0)>0).slice(0,3).map(cat=>esc(cat.emoji)+' '+Number(progress[cat.id]||0)).join(' · ');
 return '<div class="player-card '+(room?.current_turn===id&&room?.status==='playing'?'now-playing':'')+'"><div class="player-title">'+esc(title)+' '+(room?.current_turn===id&&room?.status==='playing'?'🎯':'')+'</div><strong>'+esc(profiles[id]||(id===user?.id?(user?.user_metadata?.username||user?.user_metadata?.display_name||user?.email?.split('@')[0]):null)||(id?'Alumno':'Esperando rival'))+'</strong><div class="player-counter">'+acquired+' / '+categories.length+' emojis · '+total+' aciertos</div>'+badgeLine(id)+'<details data-score="'+esc(id||'pending')+'" style="margin-top:12px"><summary style="cursor:pointer;font-weight:750">📊 Aciertos por asignatura'+(top?' · '+top:'')+'</summary><p style="font-size:12px;opacity:.85;margin:7px 0">Cada 3 aciertos en la misma asignatura consigues su emoji. Ordenadas de mayor a menor puntuación.</p>'+cells+'</details></div>';
}
function board(){
 if(!room)return '';
 return '<div class="scoreboard">'+scoreCard(room.host_id,'Anfitrión')+scoreCard(room.guest_id,'Rival')+'</div>';
}
async function loadProfiles(){
 if(!room)return;
 const ids=[room.host_id,room.guest_id].filter(x=>x&&x!==AI_ID);
 const r=await supa.from('profiles').select('id,username').in('id',ids);
 if(r.data)for(const v of r.data)if(v.username)profiles[v.id]=v.username;
 if(user?.id&&!profiles[user.id])profiles[user.id]=user.user_metadata?.username||user.user_metadata?.display_name||user.email?.split('@')[0]||'Alumno';
}
function header(){return '<div class="bar"><button class="btn" data-exit-game>← Mis duelos</button><span class="pill">Sala '+esc(room.code)+'</span><span class="pill" id="expiry">⏳ '+formatTime(timeLeft())+'</span></div>';}
function formatTime(n){return Math.floor(n/3600)+'h '+String(Math.floor(n%3600/60)).padStart(2,'0')+'m '+String(n%60).padStart(2,'0')+'s';}
function bindExit(){document.querySelectorAll('[data-exit-game]').forEach(b=>b.onclick=()=>{disconnect();if(matchTimer)clearTimeout(matchTimer);matchTimer=null;room=null;aiRoom=false;aiBusy=false;lastRematchPoll=0;loadLobby()});}
function completed(){
 const earned=(room?.awards||{});
 return [room.host_id,room.guest_id].some(x=>x&&Object.keys(earned[x]||{}).filter(y=>earned[x][y]).length===categories.length);
}
function resultBanner(){
 const l=room?.last_result;
 if(!l?.question_key)return '';
 const good=l.correct, own=l.user_id===user.id;
 const owner=own?'Has':(profiles[l.user_id]||'El rival')+' ha';
 const banner='<p class="result-banner '+(good?'ok':'error')+'">'+(good?'✅ ':'❌ ')+esc(owner)+' respondido'+(good?' correctamente.':' incorrectamente o se quedó sin tiempo.')+'</p>';
 if(good||!own)return banner;
 const original=bank.find(x=>x.key===l.question_key);
 if(!original)return banner;
 const q=conciseGameQuestion(varyQuestion(original.q,rng('duel|'+room.code+'|'+original.key),1));
 const correct=q[2],chosen=Number(l.choice);
 return banner+'<section class="card" style="border:1px solid #b56b64;margin:14px 0;background:#39252c"><h2 style="color:#ffd2ca">📚 Aprende de tu fallo</h2><p><strong>'+esc(q[0])+'</strong></p>'+visualQuestionMedia(q)+
 '<p>❌ <strong>Tu respuesta:</strong> '+(Number.isInteger(chosen)&&chosen>=0&&chosen<q[1].length?esc(q[1][chosen]):'No respondida a tiempo')+'</p>'+
 '<p>✅ <strong>Respuesta correcta:</strong> '+esc(q[1][correct])+'</p>'+
 '<p>💡 <strong>Explicación:</strong> '+esc(q[3]||'Repasa la opción correcta y su relación con el enunciado.')+'</p>'+
 '<p class="muted">Puedes revisar esta corrección mientras juega tu rival.</p></section>';
}
async function loadLobby(){
 if(!user){show('<section class="card hero"><h1>🎡 Duelo individual Radiolab</h1><p>Primero juega uno y luego el otro. Necesitas cuenta para conservar partidas.</p><a class="btn primary" href="./#auth">Acceder o registrarme</a></section>');return;}
 if(busy)return;
 aiRoom=false;
 const [a,b]=await Promise.all([supa.from('duel_rooms').select('*').eq('host_id',user.id).in('status',['waiting','playing']).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(30),supa.from('duel_rooms').select('*').eq('guest_id',user.id).in('status',['waiting','playing']).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(30)]);
 const all=[...(a.data||[]),...(b.data||[])];active=[...new Map(all.map(x=>[x.id,x])).values()].sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
 const rows=active.map(x=>'<div class="active-duel"><div><b>🎡 Sala '+esc(x.code)+'</b><p class="muted">'+(x.status==='waiting'?'Esperando al rival':x.current_turn===user.id?'🟢 Te toca jugar':'⏳ Turno del otro jugador')+' · finaliza '+new Date(x.expires_at).toLocaleString('es-ES')+'</p></div><button class="btn primary" data-resume="'+x.id+'">Continuar</button></div>').join('');
 show('<div class="card hero"><h1>🎡 Preguntados Radiolab</h1><p>Turnos individuales: gira, contesta en 30 segundos y sigue jugando mientras aciertes. Al fallar, pasa el turno. Tres aciertos de una misma asignatura desbloquean su emoji.</p><span class="pill">⏱️ Partidas de máximo 2 horas · salas eliminadas 1 h después</span></div><div class="grid"><div class="card"><h2>⚔️ Crear partida</h2><button id="create" class="btn primary">Crear sala de 2 jugadores</button><p><button id="quickmatch" class="btn primary">🔎 Jugar contra cualquiera (30 s)</button></p><p><button id="aiMatch" class="btn">🤖 Jugar contra la IA</button></p><p class="muted">Si no aparece nadie en 30 segundos, entrarás contra un personaje aleatorio. El creador empieza.</p></div><div class="card"><h2>🎟️ Entrar con código</h2><input id="code" class="field" maxlength="6" placeholder="ABC123"><button id="join" class="btn primary">Unirme</button></div></div><div class="card"><h2>📋 Partidas activas</h2>'+(rows||'<p class="muted">No tienes duelos en curso.</p>')+'</div>'+mistakesReview()+'<p id="feedback" class="error"></p>');
 document.getElementById('create').onclick=create;
 document.getElementById('quickmatch').onclick=quickMatch;
 document.getElementById('aiMatch').onclick=()=>beginAi();
 document.getElementById('join').onclick=join;
 document.querySelectorAll('[data-resume]').forEach(x=>x.onclick=()=>openRoom(active.find(y=>y.id===x.dataset.resume)));
}
async function create(){
 if(busy)return;busy=true;try{
  const bytes=crypto.getRandomValues(new Uint8Array(6)),chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const code=Array.from(bytes,x=>chars[x%chars.length]).join('');
  const r=await supa.from('duel_rooms').insert({code,host_id:user.id}).select().single();
  if(r.error)throw Error(r.error.message);await openRoom(r.data);
 }catch(e){alert('No se pudo crear: '+e.message)}finally{busy=false}
}
async function join(){
 const code=document.getElementById('code')?.value?.trim()?.toUpperCase();
 if(!/^[A-Z0-9]{6}$/.test(code||''))return alert('Escribe el código de seis caracteres');
 try{const r=await rpc('duel_join',{p_code:code});await openRoom(r)}catch(e){alert(e.message)}
}
async function openRoom(r){
 disconnect();room=r;await loadProfiles();renderRoom();connect();
}
function disconnect(){if(channel&&supa){supa.removeChannel(channel);channel=null;}}
function connect(){
 if(!room||aiRoom)return;const id=room.id;
 channel=supa.channel('duel-'+id+'-'+Date.now()).on('postgres_changes',{event:'UPDATE',schema:'public',table:'duel_rooms',filter:'id=eq.'+id},()=>refresh()).subscribe();
}
async function refresh(){
 if(!room||polling||aiRoom)return;polling=true;
 try{
  const id=room.id;
  const r=await supa.from('duel_rooms').select('*').eq('id',id).maybeSingle();
  if(room?.id!==id)return;
  if(r.data){
   const changed=r.data.revision!==room.revision||r.data.guest_id!==room.guest_id||r.data.status!==room.status;
   room=r.data;
   if(changed){await loadProfiles();renderRoom();}
  }
 }catch(e){status('No se ha podido sincronizar la partida. '+e.message)}finally{polling=false}
}
function renderRoom(){
 if(!room)return;
 rememberMistake();
 const expired=timeLeft()<=0||room.status==='expired';
 if(expired||room.status==='finished'||completed()){
  show(header()+board()+'<section class="card hero"><h1>🏁 Partida finalizada</h1><p>La duración máxima es de 2 horas.</p>'+resultBanner()+mistakesReview(true)+'<div id="rematch-panel"><button class="btn primary" id="rematch">🔁 Revancha</button><p id="rematch-status" class="muted">Los dos jugadores deben aceptar. Tienes 30 segundos desde la primera solicitud.</p></div><button class="btn" data-exit-game>Salir al inicio de la actividad</button></section><p id="feedback" class="error"></p>');
  bindExit();document.getElementById('rematch').onclick=()=>requestRematch(true);requestRematch(false);return;
 }
 if(room.status==='waiting'){
  show(header()+'<section class="card hero"><h1>⚔️ Sala de espera</h1><h2 style="font-size:40px;letter-spacing:5px">'+esc(room.code)+'</h2><p>Comparte el código con tu rival.</p><button class="btn" id="copy">Copiar código</button><p>'+(room.guest_id?'✅ Rival conectado. Comienza el anfitrión.':'⌛ Esperando al segundo jugador…')+'</p></section>'+board()+mistakesReview(true)+(room.host_id===user.id&&room.guest_id?'<section class="card"><h2>🎯 Empieza tu turno</h2><button id="start" class="btn primary">🎡 Girar ruleta</button></section>':'')+wheel()+'<p id="feedback" class="error"></p>');
  bindExit();document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(room.code);
  const start=document.getElementById('start');if(start)start.onclick=spin;
  return;
 }
 if(room.status!=='playing')return;
 const mine=room.current_turn===user.id;
 let display=header()+board()+resultBanner()+mistakesReview(true);
 if(!mine){
  if(aiRoom)scheduleAi();
  display+='<section class="card"><h2>⏳ Turno de '+esc(profiles[room.current_turn]||'tu rival')+'</h2><p>Cuando falle o se le agoten los 30 segundos, podrás girar la ruleta. Puedes cerrar esta pestaña: se guarda el turno automáticamente.</p></section>'+wheel();
 }else if(!room.question_key){
  display+='<section class="card hero"><h2>🎯 ¡Te toca!</h2><p>Gira la ruleta para elegir asignatura. Si aciertas, podrás volver a girar. Si fallas, jugará tu rival.</p><button class="btn primary" id="spin">🎡 Girar ruleta</button></section>'+wheel();
 }else{
  const original=bank.find(x=>x.key===room.question_key),found=original&&{...original,q:conciseGameQuestion(varyQuestion(original.q,rng('duel|'+room.code+'|'+original.key),1))},cat=byId(room.category);
  display+='<section class="card"><span class="pill">'+esc(cat?.emoji||'🎡')+' '+esc(cat?.name||room.category)+'</span><h2>Pregunta para '+esc(profiles[user.id]||'ti')+'</h2><div class="count" id="seconds">'+questionLeft()+'s</div>';
  if(!found)display+='<p class="error">La pregunta no está en tu versión. Actualiza la aplicación.</p>';
  else display+='<h2>'+esc(found.q[0])+'</h2>'+visualQuestionMedia(found.q)+'<div class="options">'+found.q[1].map((o,i)=>'<button class="option" data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'</div><p class="muted">Solo responde el jugador que tiene el turno. ⏱️ 30 segundos.</p>';
  display+='</section>';
 }
 display+='<p id="feedback" class="error"></p>';show(display);bindExit();
 const spinEl=document.getElementById('spin');if(spinEl)spinEl.onclick=spin;
 document.querySelectorAll('[data-answer]').forEach(x=>x.onclick=()=>answer(Number(x.dataset.answer)));
}
function randomOf(n){return crypto.getRandomValues(new Uint32Array(1))[0]%n;}
async function spin(){
 if(animating||busy||!room||room.current_turn&&room.current_turn!==user.id)return;
 if(room.status==='playing'&&room.question_key)return;
 animating=true;
 const prev=room,already=new Set(room.question_keys||[]),possible=categories.filter(c=>c.pool.some(x=>!already.has(x.key)));
 if(!possible.length){animating=false;return status('Ya se han utilizado todas las preguntas de esta partida. Finaliza a las dos horas.');}
 const cat=possible[randomOf(possible.length)],pool=cat.pool.filter(x=>!already.has(x.key)),next=drawVaried(pool,1,'radiolab.duel.history.'+cat.id),key=(next[0]||pool[randomOf(pool.length)]).key;
 const index=categories.indexOf(cat);
 const wedge=360/categories.length;
 spinAngle=Math.ceil(spinAngle/360)*360+1440+Math.floor(360-(index+.5)*wedge);
 const wheelNode=document.getElementById('wheel'),start=document.getElementById('spin');
 if(start)start.disabled=true;
 if(wheelNode){wheelNode.style.transition='transform 1.8s cubic-bezier(.18,.82,.18,1)';wheelNode.style.transform='rotate('+spinAngle+'deg)';}
 try{
  // La pregunta comienza al completar el giro; solo el servidor decide el turno activo.
  await new Promise(r=>setTimeout(r,1850));
  const next=await rpc('duel_spin',{p_room:prev.id,p_category:cat.id,p_question_key:key,p_correct_index:varyQuestion(pool.find(x=>x.key===key).q,rng('duel|'+room.code+'|'+key),1)[2]});
  if(room?.id!==prev.id)return;
  room=next;renderRoom();
 }catch(e){status('No ha sido posible girar: '+e.message);await refresh()}finally{animating=false}
}
async function answer(choice){
 if(busy||!room||room.current_turn!==user.id||!room.question_key)return;
 busy=true;const old=room,original=bank.find(x=>x.key===old.question_key),question=original&&{...original,q:varyQuestion(original.q,rng('duel|'+room.code+'|'+original.key),1)};
 if(!question){busy=false;return}
 document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);
 try{
  const r=await rpc('duel_answer',{p_room:old.id,p_choice:choice,p_correct_index:question.q[2],p_question_key:old.question_key});
  if(room?.id!==old.id)return;
  room=r;renderRoom();
 }catch(e){status('Error al responder: '+e.message);await refresh()}finally{busy=false}
}
async function requestRematch(vote=false){
 if(!room||!document.getElementById('rematch-panel')||rematchPollBusy)return;
 if(aiRoom){if(vote)beginAi();return;}
 const previous=room.id;rematchPollBusy=true;
 try{
  const {data,error}=await supa.rpc('game_rematch',{p_kind:'duel',p_room:previous,p_vote:vote});
  if(!room||room.id!==previous)return;
  if(error){const p=document.getElementById('rematch-status');if(p)p.textContent='No se pudo gestionar la revancha: '+error.message;return;}
  if(data.state==='ready'){
   const r=await supa.from('duel_rooms').select('*').eq('id',data.new_room).maybeSingle();
   if(room?.id===previous&&r.data){await openRoom(r.data);return}
  }
  const btn=document.getElementById('rematch'),p=document.getElementById('rematch-status');
  if(btn){btn.disabled=data.state==='expired'||data.voted;btn.style.display=data.state==='expired'?'none':'';btn.textContent=data.voted?'✅ Revancha solicitada':'🔁 Revancha';}
  if(p)p.textContent=data.state==='expired'?'Tiempo agotado. Pulsa Salir.':data.state==='waiting'?'Esperando al otro jugador: '+data.seconds+' s.': 'Ambos debéis aceptar; 30 segundos desde la primera solicitud.';
 }finally{rematchPollBusy=false}
}
async function tick(){
 if(!room)return;
 if(document.getElementById('rematch-panel')&&Date.now()-lastRematchPoll>1800){lastRematchPoll=Date.now();requestRematch(false).catch(console.error)}
 if(aiRoom&&room.current_turn===AI_ID&&room.status==='playing'&&!room.question_key)scheduleAi();
 const exp=document.getElementById('expiry');if(exp)exp.textContent='⏳ '+formatTime(timeLeft());
 if(timeLeft()<=0&&room.status!=='expired'&&room.status!=='finished'){
  try{room=await rpc('duel_expire',{p_room:room.id});renderRoom()}catch(e){console.warn(e)}return;
 }
 if(room.status==='playing'&&room.question_key&&questionLeft()<=0&&!busy){
  // Cualquier participante puede dar paso al siguiente turno si se acaba el tiempo.
  const found=bank.find(x=>x.key===room.question_key);
  if(!found)return;
  busy=true;const id=room.id,key=room.question_key;
  try{const next=await rpc('duel_answer',{p_room:id,p_choice:-1,p_correct_index:found.q[2],p_question_key:key});if(room?.id===id){room=next;renderRoom()}}catch(e){console.warn(e)}finally{busy=false}
 }
 const seconds=document.getElementById('seconds');if(seconds)seconds.textContent=questionLeft()+'s';
}
try{
 const sdk=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/+esm');
 supa=sdk.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);user=(await supa.auth.getUser()).data.user;
 await loadLobby();
 setInterval(()=>tick().catch(console.error),400);
 setInterval(()=>{if(room)refresh();},6000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&room)refresh()});
}catch(e){console.error(e);show('<section class="card"><h1>Conexión no disponible</h1><p>'+esc(e.message)+'</p><a href="./">Volver a Radiolab</a></section>')}
</script></body></html>
