<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071320">
<meta name="robots" content="noindex,nofollow">
<title>Radiolab Academy · Academia de Imagen</title>
<link rel="stylesheet" href="./styles.css?v=26">
<style>
#startup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 80% -15%,#143b53 0%,transparent 45%),#071320;color:#edf6ff;font-family:system-ui,sans-serif}
#startup .start-card{max-width:680px;width:100%;padding:38px;border-radius:24px;border:1px solid #2a586c;background:#0c2435}
#startup h1{font-size:clamp(32px,6vw,54px);margin:10px 0;color:#e9fdff}
#startup p{font-size:16px;color:#b9d5e0;line-height:1.6}
#startup .start-chip{color:#66deed;letter-spacing:.1em;font-size:12px;font-weight:800}
</style>
</head>
<body>
<div id="app">
 <div id="startup"><section class="start-card"><div class="start-chip">🩻 RADIOLOGÍA · TU CAMPUS DIGITAL</div>
 <h1>RADIO<span style="color:#49dfef">LAB</span> Academy</h1>
 <p>Tu espacio de estudio de Imagen para el Diagnóstico: anatomía, protección radiológica, atención al paciente y todas tus asignaturas.</p>
 <p>Preparando las lecciones y los tests… Si este mensaje no cambia, prueba a abrir la web directamente en Safari.</p>
 
 </section></div>
</div>
<script>
/* Visible recovery when the module graph fails to load (older browsers/offline/cache). */
(function(){
 let hadModuleError=false;
 window.addEventListener('error',function(ev){
  if(ev.target&&ev.target.tagName==='SCRIPT'&&ev.target.type==='module')hadModuleError=true;
 },true);
 setTimeout(function(){
  const startup=document.getElementById('startup');
  if(!startup)return; // The academy rendered correctly.
  const card=startup.querySelector('.start-card');
  if(!card)return;
  let p=document.getElementById('startup-help');
  if(p)return;
  p=document.createElement('div');
  p.id='startup-help';
  p.innerHTML='<p style="color:#ffd7ac"><strong>La academia está tardando demasiado en cargar.</strong> Puede ser un problema temporal de conexión o de algún archivo.</p><button type="button" id="startup-retry" style="background:#42d8e7;border:0;border-radius:12px;padding:13px 18px;font-weight:800;color:#052336;cursor:pointer">↻ Reintentar carga</button><p style="font-size:13px">Si persiste, prueba desde otra red o navegador y comunica el error.</p>';
  card.appendChild(p);
  document.getElementById('startup-retry').onclick=function(){
   const url=new URL(location.href);
   url.searchParams.set('retry',String(Date.now()));
   location.replace(url.href);
  };
 },12000);
})();
</script>
<script type="module" src="./app.js?v=26"></script>
</body>
</html>
