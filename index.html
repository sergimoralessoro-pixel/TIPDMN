<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071320">
<meta name="robots" content="noindex,nofollow">
<title>Radiolab Academy · Academia de Imagen</title>
<link rel="stylesheet" href="./styles.css?v=29">
<style>
#startup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 80% -15%,#143b53 0%,transparent 45%),#071320;color:#edf6ff;font-family:system-ui,sans-serif}
#startup .start-card{max-width:680px;width:100%;padding:38px;border-radius:24px;border:1px solid #2a586c;background:#0c2435}
#startup h1{font-size:clamp(32px,6vw,54px);margin:10px 0;color:#e9fdff}
#startup p{font-size:16px;color:#b9d5e0;line-height:1.6}
#startup .start-chip{color:#66deed;letter-spacing:.1em;font-size:12px;font-weight:800}
</style>
</head>
<body>
<div id="app">
 <div id="startup"><section class="start-card"><div class="start-chip">🩻 RADIOLOGÍA · TU CAMPUS DIGITAL</div>
 <h1>RADIO<span style="color:#49dfef">LAB</span> Academy</h1>
 <p>Tu espacio de estudio de Imagen para el Diagnóstico: anatomía, protección radiológica, atención al paciente y todas tus asignaturas.</p>
 <p>Preparando las lecciones y los tests… Si este mensaje no cambia, prueba a abrir la web directamente en Safari.</p>
 
 </section></div>
</div>
<script>
(function(){
 let lastFailure='';
 function showFailure(reason){
  const startup=document.getElementById('startup');
  if(!startup)return;
  const card=startup.querySelector('.start-card');
  if(!card)return;
  lastFailure=String(reason||'Error al descargar o ejecutar un archivo').slice(0,350);
  let panel=document.getElementById('startup-help');
  if(!panel){
   panel=document.createElement('div');
   panel.id='startup-help';
   panel.style.marginTop='18px';
   const title=document.createElement('p');
   title.style.color='#ffd6b4';
   title.innerHTML='<strong>⚠️ No se ha podido cargar Radiolab</strong>';
   const detail=document.createElement('p');
   detail.id='startup-error-detail';
   detail.style.cssText='overflow-wrap:anywhere;font-size:13px;opacity:.85';
   const retry=document.createElement('button');
   retry.textContent='↻ Reintentar con archivos nuevos';
   retry.style.cssText='padding:13px 18px;border:0;border-radius:12px;background:#42d8e7;color:#052336;font-weight:800;cursor:pointer';
   retry.onclick=function(){
    const u=new URL(location.href);
    u.searchParams.set('reload',String(Date.now()));
    location.replace(u.href);
   };
   panel.append(title,detail,retry);
   card.appendChild(panel);
  }
  document.getElementById('startup-error-detail').textContent='Detalle: '+lastFailure;
 }
 window.radiolabShowBootError=showFailure;
 window.addEventListener('error',function(e){
  if(document.getElementById('startup'))lastFailure=e.message||('Error al descargar '+(e.target&&e.target.src||'un recurso'));
 },true);
 window.addEventListener('unhandledrejection',function(e){
  if(document.getElementById('startup'))lastFailure=e.reason&&e.reason.message||String(e.reason||'Error desconocido');
 });
 setTimeout(function(){
  if(document.getElementById('startup'))showFailure(lastFailure||'La carga ha superado los 25 segundos. Puede haber un archivo bloqueado o una conexión lenta.');
 },25000);
})();
</script>
<script type="module">
const reload=new URLSearchParams(location.search).get('reload');
const version=reload?'32-'+reload:'32';
import('./app.js?v='+encodeURIComponent(version)).catch(error=>{
 console.error('Radiolab: error al cargar módulos',error);
 window.radiolabShowBootError?.(error?.message||String(error));
});
</script>
</body>
</html>
